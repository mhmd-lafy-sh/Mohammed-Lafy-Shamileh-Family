<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>أطلس ومجرة آل الشمايلة</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>

    <style>
        :root {
            --gold-primary: #b45309; --gold-border: #d4af37; --bg-canvas: #faf8f5; --panel-bg: rgba(255, 255, 255, 0.94);
            --text-main: #0f172a; --text-muted: #475569; --female-color: #db2777; --male-color: #0284c7;
            --wife-1: #f59e0b; --wife-2: #10b981; --wife-3: #ec4899; --sun-core: #d97706;
        }

        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; font-family: 'Tajawal', sans-serif; }
        body { margin: 0; padding: 0; background: var(--bg-canvas); color: var(--text-main); overflow: hidden; height: 100vh; width: 100vw; user-select: none; }
        
        #stars-canvas { position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0.35; }

        /* شاشة التحميل الملكية المانعة للشاشة البيضاء */
        #galaxy-loader {
            position: fixed; inset: 0; background: var(--bg-canvas); z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 18px;
            transition: opacity 0.6s ease;
        }
        .orbit-spinner {
            width: 75px; height: 75px; border: 3px dashed var(--gold-border); border-radius: 50%;
            animation: spinOrbit 3.5s linear infinite; display: flex; justify-content: center; align-items: center;
        }
        .orbit-core { width: 24px; height: 24px; background: var(--gold-primary); border-radius: 50%; box-shadow: 0 0 25px var(--gold-border); }
        @keyframes spinOrbit { to { transform: rotate(360deg); } }

        .galaxy-header {
            position: fixed; top: 0; left: 0; right: 0; height: 70px; background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(15px); z-index: 1000; display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px; border-bottom: 2px solid var(--gold-border); box-shadow: 0 4px 20px rgba(180, 83, 9, 0.08);
            transition: all 0.5s ease;
        }
        .galaxy-brand { display: flex; align-items: center; gap: 10px; }
        .galaxy-brand i { font-size: 1.8rem; color: var(--gold-border); }
        .galaxy-brand h1 { margin: 0; font-family: 'Amiri', serif; font-size: 1.3rem; color: var(--text-main); font-weight: 700; }
        .galaxy-brand span { font-size: 0.7rem; color: var(--gold-primary); display: block; font-weight: bold; }

        .header-controls { display: flex; align-items: center; gap: 10px; }
        .btn-cinema {
            background: #fffdf6; border: 1.5px solid var(--gold-border); color: var(--gold-primary);
            padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 800; cursor: pointer;
            display: flex; align-items: center; gap: 6px; box-shadow: 0 2px 8px rgba(180,83,9,0.1);
        }
        .search-galaxy-box { position: relative; width: 180px; }
        @media (max-width: 650px) { .search-galaxy-box { display: none; } .galaxy-brand span { display: none; } }
        .search-galaxy-input { width: 100%; padding: 7px 30px 7px 12px; border-radius: 20px; border: 1.5px solid #cbd5e1; font-size: 0.8rem; }
        .search-icon { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--gold-primary); font-size: 0.8rem; }

        #galaxy-viewport { position: absolute; inset: 0; z-index: 2; cursor: grab; display: flex; justify-content: center; align-items: center; }
        #galaxy-viewport:active { cursor: grabbing; }

        .rotation-speed-panel {
            position: fixed; top: 85px; right: 15px; z-index: 900; background: var(--panel-bg); border: 1.5px solid var(--gold-border);
            border-radius: 30px; padding: 6px 10px; display: flex; align-items: center; gap: 6px; box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            transition: all 0.5s ease;
        }
        .speed-pill-group { display: flex; gap: 2px; background: #f1f5f9; padding: 3px; border-radius: 20px; }
        .btn-speed { background: transparent; border: none; font-size: 0.75rem; font-weight: bold; color: var(--text-muted); padding: 4px 8px; border-radius: 14px; cursor: pointer; }
        .btn-speed.active { background: var(--text-main); color: #fff; }

        .quick-zoom-dock {
            position: fixed; top: 85px; left: 15px; z-index: 900; background: var(--panel-bg); border: 1.5px solid var(--gold-border);
            border-radius: 30px; padding: 6px 10px; display: flex; align-items: center; gap: 6px; box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            transition: all 0.5s ease;
        }
        .btn-dock-tool { background: #fff; border: 1px solid #cbd5e1; color: var(--text-main); padding: 4px 10px; border-radius: 14px; font-size: 0.75rem; font-weight: bold; cursor: pointer; }

        .generations-orbit-bar {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--panel-bg); border: 1.5px solid var(--gold-border);
            border-radius: 40px; padding: 6px 12px; z-index: 1000; display: flex; align-items: center; gap: 6px; box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            max-width: 90vw; overflow-x: auto; transition: all 0.5s ease;
        }
        
        /* زر الإضاءة العشوائية الجديد */
        .btn-auto-trace {
            background: linear-gradient(45deg, var(--gold-primary), #f59e0b); color: #fff; border: none;
            padding: 6px 14px; border-radius: 20px; font-size: 0.75rem; font-weight: 800; cursor: pointer;
            display: flex; align-items: center; gap: 6px; box-shadow: 0 4px 12px rgba(180, 83, 9, 0.3);
            animation: pulseGlow 2s infinite; white-space: nowrap; flex-shrink: 0;
        }
        .btn-auto-trace.active { background: var(--text-main); animation: none; }
        @keyframes pulseGlow { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

        .gen-pill { display: flex; align-items: center; gap: 4px; padding: 5px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; cursor: pointer; white-space: nowrap; border: 1px solid #e2e8f0; background: #fff; color: var(--text-main); }
        .gen-pill.active { background: var(--text-main); color: #fff; }

        .golden-chain-bar {
            position: fixed; top: 140px; left: 50%; transform: translateX(-50%) translateY(-150px);
            background: #fff; border: 2px solid var(--gold-border); border-radius: 30px; padding: 8px 16px;
            z-index: 950; display: flex; align-items: center; gap: 6px; box-shadow: 0 10px 30px rgba(180,83,9,0.15);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); opacity: 0; pointer-events: none; max-width: 90vw; overflow-x: auto;
        }
        .golden-chain-bar.active { transform: translateX(-50%) translateY(0); opacity: 1; pointer-events: auto; }
        .chain-step { display: flex; align-items: center; gap: 4px; font-size: 0.8rem; font-weight: 800; color: var(--text-main); white-space: nowrap; }
        .chain-step.last { color: var(--gold-primary); background: #fef3c7; padding: 2px 8px; border-radius: 12px; }

        .cinema-restore-trigger {
            position: fixed; top: 18px; right: 18px; z-index: 1100; background: rgba(255, 255, 255, 0.95); border: 2px solid var(--gold-border);
            border-radius: 30px; padding: 8px 16px; display: none; align-items: center; gap: 8px; box-shadow: 0 6px 25px rgba(180, 83, 9, 0.2); cursor: pointer; font-weight: bold; color: var(--gold-primary);
        }

        body.cinema-mode .galaxy-header, body.cinema-mode .rotation-speed-panel, body.cinema-mode .quick-zoom-dock, body.cinema-mode .generations-orbit-bar { opacity: 0; pointer-events: none; }
        body.cinema-mode .cinema-restore-trigger { display: flex; }

        @media (max-width: 768px) {
            .rotation-speed-panel { top: auto; bottom: 80px; right: 50%; transform: translateX(50%); }
            .quick-zoom-dock { top: 85px; left: 50%; transform: translateX(-50%); width: auto; justify-content: center; }
            .golden-chain-bar { top: 130px; }
        }

        /* رسومات D3 المتباعدة وحرم الأسماء */
        .node-circle { cursor: pointer; transition: all 0.3s ease; stroke-width: 2.5px; }
        .node-circle.active-target { stroke: var(--text-main) !important; stroke-width: 5px; filter: drop-shadow(0 0 16px var(--gold-border)); }
        .spouse-moon { cursor: pointer; stroke: #ffffff; stroke-width: 2px; transition: transform 0.25s ease; }
        .spouse-orbit-ring { fill: none; stroke: rgba(180, 83, 9, 0.2); stroke-dasharray: 3 3; stroke-width: 1.2px; }
        .link-line { fill: none; stroke: rgba(180, 83, 9, 0.22); stroke-width: 1.5px; transition: all 0.3s ease; }
        .link-line.highlighted { stroke: var(--gold-primary) !important; stroke-width: 3.5px !important; }
        .node-text { font-weight: 800; fill: var(--text-main); text-anchor: middle; pointer-events: none; paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
    </style>
</head>
<body>

    <canvas id="stars-canvas"></canvas>

    <!-- شاشة التحميل لا تختفي إلا بعد الرسم -->
    <div id="galaxy-loader">
        <div class="orbit-spinner"><div class="orbit-core"></div></div>
        <div style="font-family:'Amiri', serif; font-size:1.55rem; color:var(--text-main); font-weight:700;">أطلس ومجرة آل الشمايلة المباركة</div>
        <div style="font-size:0.92rem; color:var(--gold-primary); font-weight:bold;">صدقة جارية عن روح المرحوم بإذن الله تعالى الحاج أبو علي الشمايلة</div>
    </div>

    <header class="galaxy-header">
        <div class="galaxy-brand">
            <i class="fas fa-crown"></i>
            <div>
                <h1>أطلس ومجرة آل الشمايلة</h1>
                <span>المجرة الفلكية الشاملة لكافة الأجيال</span>
            </div>
        </div>
        <div class="header-controls">
            <button class="btn-cinema" onclick="toggleCinemaMode()"><i class="fas fa-expand"></i> المشهد الصافي</button>
            <div class="search-galaxy-box">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="galaxySearchInput" class="search-galaxy-input" placeholder="ابحث بالاسم..." oninput="handleGalaxySearch(this.value)">
            </div>
        </div>
    </header>

    <div class="cinema-restore-trigger" onclick="toggleCinemaMode()">
        <i class="fas fa-crown"></i> <span>إظهار الأدوات</span>
    </div>

    <div class="quick-zoom-dock">
        <button class="btn-dock-tool" onclick="zoomToCenter()"><i class="fas fa-sun" style="color:var(--gold-primary);"></i> المركز</button>
        <button class="btn-dock-tool" onclick="zoomFitGalaxy()"><i class="fas fa-globe"></i> المجرة</button>
    </div>

    <div class="rotation-speed-panel" id="rotationPanel">
        <div class="speed-pill-group">
            <button class="btn-speed active" id="sp0" onclick="setSpinSpeed(0, this)">⏸ إيقاف</button>
            <button class="btn-speed" id="sp1" onclick="setSpinSpeed(1, this)">1x بطيء</button>
            <button class="btn-speed" id="sp2" onclick="setSpinSpeed(2, this)">2x متزن</button>
        </div>
    </div>

    <div class="golden-chain-bar" id="goldenChainBar">
        <span style="font-size:0.82rem; color:var(--gold-primary); font-weight:bold;"><i class="fas fa-crown"></i> مسار النسب:</span>
        <div id="chainStepsContainer" style="display:flex; align-items:center; gap:6px;"></div>
        <button onclick="closeGoldenChain()" style="background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:1.1rem; margin-right:4px;">&times;</button>
    </div>

    <div id="galaxy-viewport">
        <svg id="galaxy-svg" style="width:100%; height:100%;"></svg>
    </div>

    <nav class="generations-orbit-bar" id="generationBar">
        <!-- زر النبض العشوائي لإضاءة الأنساب -->
        <button class="btn-auto-trace" id="btnAutoTrace" onclick="toggleAutoTrace()"><i class="fas fa-magic"></i> إضاءة الأنساب</button>
        
        <div class="gen-pill active" onclick="filterByGeneration(0, this)"><div class="gen-dot" style="background:#0f172a;"></div> الكل</div>
        <div class="gen-pill" onclick="filterByGeneration(1, this)"><div class="gen-dot" style="background:var(--gen-1);"></div> ج1 (حمد)</div>
        <div class="gen-pill" onclick="filterByGeneration(3, this)"><div class="gen-dot" style="background:var(--gen-3);"></div> ج3 (شهاب)</div>
        <div class="gen-pill" onclick="filterByGeneration(5, this)"><div class="gen-dot" style="background:var(--gen-5);"></div> ج5 (محمد)</div>
        <div class="gen-pill" onclick="filterByGeneration(6, this)"><div class="gen-dot" style="background:var(--gen-6);"></div> ج6 (الأبناء)</div>
        <div class="gen-pill" onclick="filterByGeneration(7, this)"><div class="gen-dot" style="background:var(--gen-7);"></div> ج7-9 (الأحفاد)</div>
    </nav>

    <script>
        const API_ENDPOINT = "https://script.google.com/macros/s/AKfycbxccrt-ImboZZnbHdpoh9i9X-jBIn1-Aw3S4ao5PR5jOV5vso_1aay8jrpQLwEywdU/exec";
        const CACHE_KEY = "shamayleh_galaxy_cache_v2026_perfect";
        
        let rawTreeData = null;
        let rootHierarchy = null;
        let selectedNodeData = null;
        let allLeafNodes = []; // للإضاءة العشوائية
        
        let currentRotation = 0;
        let spinSpeedLevel = 0;
        let spinAnimationId = null;

        let autoTraceInterval = null;
        let isAutoTracing = false;

        const wifeColors = ["#f59e0b", "#10b981", "#ec4899", "#38bdf8", "#8b5cf6"];

        // المحرك السريع: يفتح الشاشة البيضاء ويحمل في الخلفية
        function loadGalaxyDataFast() {
            try {
                const cached = localStorage.getItem(CACHE_KEY);
                if (cached) {
                    rawTreeData = JSON.parse(cached);
                    initGalaxyVisualization();
                }
            } catch(e){}

            const script = document.createElement('script');
            const callback = 'onGalaxyLoaded_' + Date.now();
            window[callback] = function(res) {
                if (res && res.status === 'success' && res.tree) {
                    const newJson = JSON.stringify(res.tree);
                    if (!rawTreeData || newJson !== localStorage.getItem(CACHE_KEY)) {
                        localStorage.setItem(CACHE_KEY, newJson);
                        rawTreeData = res.tree;
                        initGalaxyVisualization();
                    } else if (rawTreeData) {
                        // إذا كانت البيانات نفسها والرسمة موجودة، فقط اخفِ شاشة التحميل
                        hideLoaderSafely();
                    }
                }
                delete window[callback];
                try { document.body.removeChild(script); } catch(e){}
            };
            script.src = `${API_ENDPOINT}?action=get_full_tree_data&callback=${callback}&t=${Date.now()}`;
            document.body.appendChild(script);
        }

        function hideLoaderSafely() {
            // نستخدم requestAnimationFrame لضمان أن المتصفح أنهى عمليات الرسم الثقيلة
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    const loader = document.getElementById('galaxy-loader');
                    if (loader) {
                        loader.style.opacity = '0';
                        setTimeout(() => { loader.style.display = 'none'; }, 600);
                    }
                });
            });
        }

        const svg = d3.select("#galaxy-svg");
        const gMain = svg.append("g").attr("id", "galaxy-main-group");
        const zoomBehavior = d3.zoom().scaleExtent([0.1, 4.0]).on("zoom", (e) => gMain.attr("transform", e.transform));
        svg.call(zoomBehavior);

        function initGalaxyVisualization() {
            if (!rawTreeData) return;
            rootHierarchy = d3.hierarchy(rawTreeData);
            
            // جمع الأطراف للإضاءة العشوائية
            allLeafNodes = rootHierarchy.descendants().filter(d => !d.children || d.children.length === 0);
            
            // تأخير بسيط لعدم تجميد واجهة المستخدم أثناء الرسم
            setTimeout(() => {
                renderRadialGalaxy();
                hideLoaderSafely();
            }, 50);
        }

        let gRadialContainer = null;

        function renderRadialGalaxy() {
            gMain.selectAll("*").remove();
            const width = window.innerWidth;
            const height = window.innerHeight;
            const isMobile = width < 768;

            const maxDepth = d3.max(rootHierarchy.descendants(), d => d.depth) || 8;
            // توسيع الحرم الفلكي لمنع تداخل النصوص
            const radius = Math.max(1600, maxDepth * 320);

            const treeLayout = d3.tree()
                .size([2 * Math.PI, radius])
                .separation((a, b) => (a.parent == b.parent ? 3.0 : 5.0) / (a.depth || 1));

            treeLayout(rootHierarchy);

            gRadialContainer = gMain.append("g")
                .attr("id", "radial-rotatable-group")
                .attr("transform", `translate(${width / 2}, ${height / 2}) rotate(${currentRotation})`);

            const orbitGroup = gRadialContainer.append("g").attr("class", "orbit-rings");
            for (let i = 1; i <= maxDepth; i++) {
                orbitGroup.append("circle").attr("r", (radius / maxDepth) * i).attr("fill", "none").attr("stroke", "rgba(180, 83, 9, 0.08)").attr("stroke-dasharray", "4 6");
            }

            const linkGenerator = d3.linkRadial().angle(d => d.x).radius(d => d.y);
            gRadialContainer.append("g")
                .selectAll("path")
                .data(rootHierarchy.links())
                .join("path")
                .attr("class", "link-line")
                .attr("id", d => `link-${d.source.data.id}-${d.target.data.id}`)
                .attr("d", d => linkGenerator(d));

            const nodeGroup = gRadialContainer.append("g")
                .selectAll("g")
                .data(rootHierarchy.descendants())
                .join("g")
                .attr("class", "node-element")
                .attr("id", d => `node-g-${d.data.id}`)
                .attr("transform", d => `rotate(${d.x * 180 / Math.PI - 90}) translate(${d.y}, 0)`);

            nodeGroup.append("circle")
                .attr("class", "node-circle")
                .attr("r", d => {
                    if (d.depth === 0) return 24;
                    if (d.depth === 1) return 18;
                    if (d.depth <= 3) return 14;
                    if (d.depth <= 5) return 11;
                    return 8.5;
                })
                .attr("fill", d => d.depth === 0 ? "var(--sun-core)" : (d.data.gender === 'female' ? "var(--female-color)" : "var(--male-color)"))
                .attr("stroke", "#ffffff")
                .on("click", (e, d) => {
                    if (isAutoTracing) toggleAutoTrace(); // إيقاف التتبع عند النقر اليدوي
                    traceFullLineage(d);
                });

            nodeGroup.each(function(d) {
                if (d.data.spouses && d.data.spouses.length > 0) {
                    const gSpouses = d3.select(this).append("g").attr("class", "spouses-orbit-group");
                    const orbitDist = d.depth === 0 ? 36 : 26;

                    gSpouses.append("circle").attr("class", "spouse-orbit-ring").attr("r", orbitDist);

                    d.data.spouses.forEach((sp, idx) => {
                        const angle = (idx * (2 * Math.PI / d.data.spouses.length)) - (Math.PI / 2);
                        const moon = gSpouses.append("g")
                            .attr("class", "spouse-moon-group")
                            .attr("transform", `translate(${orbitDist * Math.cos(angle)}, ${orbitDist * Math.sin(angle)})`);

                        moon.append("circle")
                            .attr("class", "spouse-moon")
                            .attr("r", d.depth === 0 ? 8 : 6.5)
                            .attr("fill", sp.color || wifeColors[idx % wifeColors.length]);
                    });
                }
            });

            nodeGroup.append("text")
                .attr("class", "node-text")
                .attr("dy", "0.32em")
                .style("font-size", d => d.depth === 0 ? "17px" : (d.depth <= 3 ? "14px" : "12px"))
                .text(d => d.data.name);

            updateSmartTextOrientation();

            if (isMobile) zoomToCenter();
            else svg.call(zoomBehavior.transform, d3.zoomIdentity.translate(0, 0).scale(0.65));
        }

        function updateSmartTextOrientation() {
            if (!gRadialContainer) return;
            gRadialContainer.selectAll(".node-element").each(function(d) {
                const nodeAngleDeg = (d.x * 180 / Math.PI - 90 + currentRotation) % 360;
                const normalized = (nodeAngleDeg + 360) % 360;
                const isLeftHalf = normalized > 90 && normalized < 270;
                const offset = (d.data.spouses && d.data.spouses.length > 0) ? 38 : (d.depth === 0 ? 32 : 20);

                d3.select(this).select("text")
                    .attr("x", isLeftHalf ? -offset : offset)
                    .attr("text-anchor", isLeftHalf ? "end" : "start")
                    .attr("transform", isLeftHalf ? "rotate(180)" : null);
            });
        }

        // =========================================================================
        // 🔮 محرك النبض العشوائي لإضاءة الأنساب (Auto-Trace Engine)
        // =========================================================================
        function toggleAutoTrace() {
            const btn = document.getElementById('btnAutoTrace');
            isAutoTracing = !isAutoTracing;
            
            if (isAutoTracing) {
                btn.classList.add('active');
                btn.innerHTML = '<i class="fas fa-stop"></i> إيقاف النبض';
                // إغلاق أي نافذة مفتوحة
                closeGoldenChain();
                
                function traceNextRandom() {
                    if (!isAutoTracing) return;
                    if (allLeafNodes.length > 0) {
                        const randomNode = allLeafNodes[Math.floor(Math.random() * allLeafNodes.length)];
                        traceFullLineage(randomNode);
                        
                        // توجيه الكاميرا نحو النجم المختار ببطء
                        const width = window.innerWidth;
                        const height = window.innerHeight;
                        const transform = d3.zoomIdentity.translate(width/2, height/2).scale(0.85).translate(-randomNode.y * Math.cos(randomNode.x - Math.PI/2), -randomNode.y * Math.sin(randomNode.x - Math.PI/2));
                        svg.transition().duration(1500).call(zoomBehavior.transform, transform);
                    }
                    autoTraceInterval = setTimeout(() => {
                        closeGoldenChain();
                        setTimeout(traceNextRandom, 800); // راحة قصيرة ثم نبض جديد
                    }, 4500); // مدة إضاءة المسار
                }
                traceNextRandom();

            } else {
                btn.classList.remove('active');
                btn.innerHTML = '<i class="fas fa-magic"></i> إضاءة الأنساب';
                clearTimeout(autoTraceInterval);
                closeGoldenChain();
                resetView();
            }
        }

        // =========================================================================
        // 🌟 إضاءة وتتبع السلسلة
        // =========================================================================
        function traceFullLineage(node) {
            if (!node) return;
            selectedNodeData = node;
            
            // إطفاء البقية وإضاءة النجم المختار
            d3.selectAll(".node-circle").classed("active-target", false);
            d3.select(`#node-g-${node.data.id} circle`).classed("active-target", true);

            const chain = [];
            let curr = node;
            while (curr) { chain.unshift(curr); curr = curr.parent; }

            // إضاءة الروابط
            d3.selectAll(".link-line").classed("highlighted", false).style("opacity", 0.1);
            d3.selectAll(".node-element").style("opacity", 0.2);

            chain.forEach((n, i) => {
                d3.select(`#node-g-${n.data.id}`).style("opacity", 1);
                if (i < chain.length - 1) {
                    d3.select(`#link-${chain[i].data.id}-${chain[i+1].data.id}`).classed("highlighted", true).style("opacity", 1);
                }
            });

            // تعبئة شريط النسب العلوي
            const container = document.getElementById('chainStepsContainer');
            container.innerHTML = '';
            chain.forEach((n, idx) => {
                const isLast = (idx === chain.length - 1);
                container.innerHTML += `
                    <div class="chain-step ${isLast ? 'last' : ''}">
                        <span>${n.data.name}</span>
                        ${!isLast ? '<i class="fas fa-chevron-left"></i>' : ''}
                    </div>
                `;
            });
            document.getElementById('goldenChainBar').classList.add('active');
        }

        function closeGoldenChain() {
            document.getElementById('goldenChainBar').classList.remove('active');
            d3.selectAll(".link-line").classed("highlighted", false).style("opacity", 1);
            d3.selectAll(".node-element").style("opacity", 1);
            d3.selectAll(".node-circle").classed("active-target", false);
        }

        // =========================================================================
        // 🎮 الدوران والتحكم بالكاميرا
        // =========================================================================
        function setSpinSpeed(speedLevel, btn) {
            spinSpeedLevel = speedLevel;
            document.querySelectorAll('.btn-speed').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            if (spinAnimationId) cancelAnimationFrame(spinAnimationId);

            if (spinSpeedLevel > 0) {
                const step = (spinSpeedLevel === 1) ? 0.05 : ((spinSpeedLevel === 2) ? 0.15 : 0.35);
                function animate() {
                    currentRotation = (currentRotation + step) % 360;
                    applyGalaxyRotation();
                    spinAnimationId = requestAnimationFrame(animate);
                }
                spinAnimationId = requestAnimationFrame(animate);
            }
        }

        function rotateGalaxyBy(deltaDeg) { currentRotation = (currentRotation + deltaDeg) % 360; applyGalaxyRotation(); }
        function applyGalaxyRotation() {
            if (gRadialContainer) {
                gRadialContainer.attr("transform", `translate(${window.innerWidth / 2}, ${window.innerHeight / 2}) rotate(${currentRotation})`);
                updateSmartTextOrientation();
            }
        }

        function toggleCinemaMode() { document.body.classList.toggle('cinema-mode'); }

        function zoomToCenter() {
            const w = window.innerWidth, h = window.innerHeight;
            svg.transition().duration(800).call(zoomBehavior.transform, d3.zoomIdentity.translate(w/2, h/2).scale(w < 768 ? 0.9 : 1.2).translate(-w/2, -h/2));
        }
        function zoomFitGalaxy() {
            const w = window.innerWidth;
            svg.transition().duration(800).call(zoomBehavior.transform, d3.zoomIdentity.translate(0, 0).scale(w < 768 ? 0.35 : 0.45));
        }
        function resetView() {
            const w = window.innerWidth;
            svg.transition().duration(800).call(zoomBehavior.transform, d3.zoomIdentity.translate(0, 0).scale(w < 768 ? 0.6 : 0.65));
        }

        function filterByGeneration(gen, btn) {
            if (isAutoTracing) toggleAutoTrace(); // تعطيل الإضاءة العشوائية عند التصفية
            document.querySelectorAll('.gen-pill').forEach(p => p.classList.remove('active'));
            btn.classList.add('active');

            if (gen === 0) {
                d3.selectAll(".node-element").style("opacity", 1);
                d3.selectAll(".link-line").style("opacity", 1);
            } else {
                d3.selectAll(".node-element").style("opacity", d => (d.data.generation === gen || (gen === 7 && d.data.generation >= 7)) ? 1 : 0.1);
                d3.selectAll(".link-line").style("opacity", 0.05);
            }
        }

        function handleGalaxySearch(query) {
            if (isAutoTracing) toggleAutoTrace();
            if (!query.trim()) { closeGoldenChain(); return; }
            const clean = query.trim().toLowerCase();
            const matched = rootHierarchy.descendants().find(d => d.data.name.toLowerCase().includes(clean));
            if (matched) traceFullLineage(matched);
        }

        // ذرات النور الخلفية
        const canvas = document.getElementById("stars-canvas");
        const ctx = canvas.getContext("2d");
        let stars = [];
        function initStars() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            stars = Array.from({ length: 40 }, () => ({
                x: Math.random() * canvas.width, y: Math.random() * canvas.height,
                radius: Math.random() * 1.5 + 0.3, alpha: Math.random() * 0.4 + 0.1,
                dx: (Math.random() - 0.5) * 0.1, dy: (Math.random() - 0.5) * 0.1
            }));
        }
        function drawStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(s => {
                ctx.beginPath(); ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(180, 83, 9, ${s.alpha})`; ctx.fill();
                s.x += s.dx; s.y += s.dy;
                if (s.x < 0) s.x = canvas.width; if (s.x > canvas.width) s.x = 0;
                if (s.y < 0) s.y = canvas.height; if (s.y > canvas.height) s.y = 0;
            });
            requestAnimationFrame(drawStars);
        }
        window.addEventListener('resize', () => { initStars(); if (rootHierarchy) renderRadialGalaxy(); });
        initStars(); drawStars();

        // تشغيل التحميل اللحظي
        loadGalaxyDataFast();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>سجل شجرة آل الشمايلة - المنظومة السحابية الملكية</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

    <style>
        :root {
            --primary: #0f172a;
            --gold: #c5a85c;
            --gold-hover: #dfc278;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --line-color: #cbd5e1;
            --female-color: #ec4899; 
            --male-color: #0284c7;   
            --success: #10b981;      
            --danger: #ef4444;       
        }

        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; font-family: 'Tajawal', sans-serif; }

        body {
            margin: 0; padding: 0; background-color: var(--bg-color);
            background-image: radial-gradient(#e2e8f0 1.2px, transparent 1.2px);
            background-size: 24px 24px; overflow: hidden; height: 100vh; width: 100vw;
            user-select: none; color: var(--text-main); touch-action: none;
        }

        .navbar {
            position: fixed; top: 0; left: 0; right: 0; height: 68px;
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px; z-index: 1000; box-shadow: 0 4px 20px rgba(0,0,0,0.04);
            border-bottom: 2px solid var(--gold);
        }

        .brand { display: flex; align-items: center; gap: 12px; color: var(--primary); }
        .brand i { font-size: 1.8rem; color: var(--gold); }
        .brand h1 { margin: 0; font-family: 'Amiri', serif; font-size: 1.45rem; font-weight: 700; }

        .search-container { position: relative; margin: 0 12px; flex: 1; max-width: 320px; }
        .search-input {
            width: 100%; padding: 8px 36px 8px 12px; border-radius: 20px;
            border: 1px solid #cbd5e1; background: #f1f5f9; color: var(--primary);
            font-size: 0.85rem; transition: all 0.25s ease;
        }
        .search-input:focus { background: #fff; border-color: var(--gold); box-shadow: 0 4px 12px rgba(197, 168, 92, 0.2); }
        .search-icon { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 0.85rem; }

        .toolbar { display: flex; gap: 8px; align-items: center; }
        .btn {
            background: #f1f5f9; color: var(--primary); border: 1px solid #cbd5e1;
            padding: 8px 12px; border-radius: 20px; cursor: pointer; transition: all 0.2s;
            display: flex; align-items: center; justify-content: center; font-size: 0.85rem;
        }
        .btn:hover { background: var(--primary); color: #fff; border-color: var(--primary); }

        .info-panel {
            position: fixed; bottom: 20px; right: 20px;
            background: rgba(255, 255, 255, 0.92); padding: 12px 16px; border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06); z-index: 900; width: 195px;
            border-right: 3px solid var(--gold); backdrop-filter: blur(10px);
        }
        .info-panel h4 { margin: 0 0 6px 0; color: var(--primary); font-size: 0.85rem; font-weight: 700; border-bottom: 1px solid #e2e8f0; padding-bottom: 4px; }
        .stat-row { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 4px; font-weight: 500; }

        #viewport { width: 100%; height: 100%; cursor: grab; overflow: hidden; display: flex; justify-content: center; align-items: center; position: relative; }
        #viewport:active { cursor: grabbing; }
        #tree-container { transform-origin: center top; padding-top: 100px; transition: transform 0.15s cubic-bezier(0.25, 1, 0.5, 1); }

        .tree ul { padding-top: 30px; position: relative; transition: all 0.4s; display: flex; justify-content: center; padding-right: 0; padding-left: 0; }
        .tree li { text-align: center; list-style-type: none; position: relative; padding: 30px 6px 0 6px; transition: all 0.4s; display: flex; flex-direction: column; align-items: center; }
        .tree li::before, .tree li::after { content: ''; position: absolute; top: 0; height: 30px; width: 50%; border-top: 1.5px solid var(--line-color); z-index: -1; }
        .tree li::before { right: 50%; border-right: 0; }
        .tree li::after { left: 50%; border-left: 1.5px solid var(--line-color); }
        .tree li:first-child::after { border-top: none; border-left: none; }
        .tree li:first-child::before { border-right: 1.5px solid var(--line-color); border-radius: 0 8px 0 0; }
        .tree li:last-child::before { border-top: none; border-right: none; }
        .tree li:last-child::after { border-radius: 8px 0 0 0; }
        .tree li:only-child::after, .tree li:only-child::before { display: none; }
        .tree li:only-child { padding-top: 0; }
        .tree ul ul::before { content: ''; position: absolute; top: 0; left: 50%; border-left: 1.5px solid var(--line-color); width: 0; height: 30px; transform: translateX(-50%); }

        .node-wrapper { display: inline-flex; flex-direction: column; align-items: center; position: relative; z-index: 2; }
        
        /* تصميم مجموعة البطاقات مع الزوجات المتناظرة */
        .card-group {
            display: flex; align-items: center; background: var(--card-bg);
            border-radius: 14px; padding: 4px; box-shadow: 0 2px 10px rgba(15, 23, 42, 0.05);
            border: 1.5px solid #e2e8f0; transition: all 0.2s ease; cursor: pointer;
        }
        .card-group:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(197, 168, 92, 0.2); border-color: var(--gold); }
        .card-group.highlighted { border: 2.5px solid var(--gold); box-shadow: 0 0 25px rgba(197, 168, 92, 0.6); animation: pulse-glow 1.5s infinite; }
        @keyframes pulse-glow { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }

        .person-card { padding: 4px 10px; text-align: center; min-width: 95px; position: relative; }
        .person-card.spouse { min-width: 85px; }

        .avatar {
            width: 38px; height: 38px; background: #f1f5f9; color: var(--primary);
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-size: 1rem; margin: 0 auto 4px auto; border: 1.5px solid #cbd5e1;
        }
        .avatar.female { color: var(--female-color); border-color: var(--female-color); background: #fdf2f8; }
        .avatar.male { color: var(--male-color); border-color: var(--male-color); background: #f0f9ff; }
        
        .p-name { font-weight: 700; color: var(--primary); font-size: 0.85rem; white-space: nowrap; }
        .p-title { font-size: 0.68rem; color: var(--gold); font-weight: bold; margin-top: 1px; }
        
        /* شارة الأم الوقورة */
        .p-mother {
            font-size: 0.65rem; color: #b45309; background: #fef3c7; border: 1px solid #fde68a;
            border-radius: 12px; padding: 1px 6px; margin-top: 3px; display: inline-block; white-space: nowrap;
        }

        /* رابط الزوجة المتناظر مع القلب */
        .spouse-connector {
            width: 18px; height: 2px; background: var(--gold);
            display: flex; align-items: center; justify-content: center; position: relative;
        }
        .spouse-connector i { font-size: 8px; color: var(--danger); background: #fff; border-radius: 50%; padding: 2px; border: 1px solid var(--gold); }

        .collapse-btn {
            width: 20px; height: 20px; background: var(--primary); color: #fff;
            border-radius: 50%; border: 2px solid #fff; display: flex; justify-content: center; align-items: center;
            font-size: 8px; cursor: pointer; margin-top: -10px; z-index: 5;
        }

        .floating-action-bar { position: fixed; bottom: 20px; left: 20px; z-index: 900; display: flex; flex-direction: column; gap: 10px; }
        .btn-fab {
            width: 50px; height: 50px; border-radius: 50%; background: var(--primary); color: var(--gold);
            border: 2px solid var(--gold); display: flex; justify-content: center; align-items: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.25); cursor: pointer; transition: all 0.3s; font-size: 1.2rem;
        }

        #loading-overlay {
            position: fixed; inset: 0; background: #0f172a; color: #fff; z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 15px;
        }
        .loader-spin {
            width: 45px; height: 45px; border: 4px solid rgba(197, 168, 92, 0.2);
            border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loading-overlay">
        <div class="loader-spin"></div>
        <div style="font-family:'Amiri', serif; font-size:1.3rem; color:var(--gold);">جاري مزامنة شجرة آل الشمايلة السحابية...</div>
    </div>

    <nav class="navbar">
        <div class="brand">
            <i class="fas fa-crown"></i>
            <div>
                <h1>شجرة آل الشمايلة</h1>
            </div>
        </div>
        
        <div class="search-container">
            <i class="fas fa-search search-icon"></i>
            <input type="text" id="searchInput" class="search-input" placeholder="ابحث عن أي اسم..." onkeyup="handleSearch(event)">
        </div>

        <div class="toolbar">
            <button class="btn" onclick="screenshotTree()" title="لقطة الشجرة" style="color:var(--gold);"><i class="fas fa-camera"></i></button>
        </div>
    </nav>

    <div class="floating-action-bar">
        <button class="btn-fab" onclick="resetView()" title="العودة للجد المؤسس"><i class="fas fa-crown"></i></button>
    </div>

    <div class="info-panel" id="statsPanel">
        <h4>إحصائيات الشجرة</h4>
        <div class="stat-row"><span>إجمالي الأفراد:</span> <span id="stat-total" style="color:var(--gold); font-weight:bold;">0</span></div>
        <div class="stat-row"><span>الذكور:</span> <span id="stat-male">0</span></div>
        <div class="stat-row"><span>الإناث:</span> <span id="stat-female">0</span></div>
        <div class="stat-row"><span>أقصى عمق للأجيال:</span> <span id="stat-depth">0</span></div>
    </div>

    <div id="viewport">
        <div id="tree-container" class="tree"></div>
    </div>

    <script>
        const API_ENDPOINT = "https://script.google.com/macros/s/AKfycbxccrt-ImboZZnbHdpoh9i9X-jBIn1-Aw3S4ao5PR5jOV5vso_1aay8jrpQLwEywdU/exec";
        let treeData = null;

        function fetchCloudTreeData() {
            const script = document.createElement('script');
            const callbackName = 'onTreeDataLoaded_' + Date.now();
            window[callbackName] = function(response) {
                if (response && response.status === 'success' && response.tree) {
                    treeData = response.tree;
                    render();
                    resetView();
                    document.getElementById('loading-overlay').style.display = 'none';
                }
                delete window[callbackName];
                document.body.removeChild(script);
            };
            script.src = `${API_ENDPOINT}?action=get_full_tree_data&callback=${callbackName}&t=${Date.now()}`;
            document.body.appendChild(script);
        }

        const container = document.getElementById('tree-container');

        function render() {
            if (!treeData) return;
            container.innerHTML = '';
            const ul = document.createElement('ul');
            ul.appendChild(createNode(treeData));
            container.appendChild(ul);
            updateStats();
        }

        function createNode(node) {
            const li = document.createElement('li');
            const wrapper = document.createElement('div');
            wrapper.className = 'node-wrapper';

            const group = document.createElement('div');
            group.className = 'card-group';
            group.id = `node-${node.id}`;

            let rightHtml = "";
            let leftHtml = "";
            const mainHtml = createPersonHTML(node);

            // تمثيل الزوجات المتناظرة هندسياً (يمين ويسار بالتناوب مع قلوب الربط)
            if (node.spouses && node.spouses.length > 0) {
                node.spouses.forEach((spouse, index) => {
                    const spouseCard = createPersonHTML(spouse, true);
                    const connector = `<div class="spouse-connector"><i class="fas fa-heart"></i></div>`;
                    if (index % 2 === 0) rightHtml += (spouseCard + connector); 
                    else leftHtml += (connector + spouseCard);
                });
            }

            group.innerHTML = rightHtml + mainHtml + leftHtml;
            wrapper.appendChild(group);

            if (node.children && node.children.length > 0) {
                const btn = document.createElement('div');
                btn.className = 'collapse-btn';
                btn.innerHTML = node.collapsed ? '<i class="fas fa-plus"></i>' : '<i class="fas fa-minus"></i>';
                btn.onclick = (e) => {
                    e.stopPropagation();
                    node.collapsed = !node.collapsed;
                    render();
                };
                wrapper.appendChild(btn);
            }

            li.appendChild(wrapper);

            if (node.children && node.children.length > 0 && !node.collapsed) {
                const ul = document.createElement('ul');
                node.children.forEach(child => ul.appendChild(createNode(child)));
                li.appendChild(ul);
            }

            return li;
        }

        function createPersonHTML(person, isSpouse = false) {
            const isFemale = person.gender === 'female';
            const cls = isFemale ? 'avatar female' : 'avatar male';
            const icon = isFemale ? 'fa-female' : 'fa-user-tie';
            const cardClass = isSpouse ? 'person-card spouse' : 'person-card';

            const motherBadge = (!isSpouse && person.motherName) 
                ? `<div class="p-mother"><i class="fas fa-heart" style="font-size:7px;"></i> الأم: ${person.motherName}</div>` : '';

            return `
                <div class="${cardClass}">
                    <div class="${cls}"><i class="fas ${icon}"></i></div>
                    <div class="p-name">${person.name}</div>
                    ${person.title && !isSpouse ? `<div class="p-title">${person.title}</div>` : ''}
                    ${motherBadge}
                </div>
            `;
        }

        function normalizeArabic(text) {
            if (!text) return '';
            return text.replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/\s+/g, ' ').trim();
        }

        function handleSearch(e) {
            const query = normalizeArabic(document.getElementById('searchInput').value);
            if (!query) return;
            document.querySelectorAll('.highlighted').forEach(el => el.classList.remove('highlighted'));

            let foundId = null;
            function searchTree(node) {
                if (normalizeArabic(node.name).includes(query)) { foundId = node.id; return true; }
                if (node.children) {
                    for (let child of node.children) {
                        if (searchTree(child)) { node.collapsed = false; return true; }
                    }
                }
                return false;
            }

            if (searchTree(treeData)) {
                render();
                setTimeout(() => {
                    const el = document.getElementById(`node-${foundId}`);
                    if (el) {
                        el.classList.add('highlighted');
                        el.scrollIntoView({ behavior: "smooth", block: "center", inline: "center" });
                    }
                }, 150);
            }
        }

        function updateStats() {
            let total = 0, male = 0, female = 0, maxDepth = 0;
            function traverse(node, depth) {
                total++;
                if (node.gender === 'female') female++; else male++;
                if (node.spouses) total += node.spouses.length;
                if (depth > maxDepth) maxDepth = depth;
                if (node.children) node.children.forEach(c => traverse(c, depth + 1));
            }
            traverse(treeData, 1);
            document.getElementById('stat-total').innerText = total;
            document.getElementById('stat-male').innerText = male;
            document.getElementById('stat-female').innerText = female;
            document.getElementById('stat-depth').innerText = maxDepth;
        }

        function screenshotTree() {
            const originalTransform = container.style.transform;
            container.style.transform = 'scale(1)';
            html2canvas(document.getElementById('tree-container'), { backgroundColor: "#f8fafc", scale: 2 })
            .then(canvas => {
                const link = document.createElement('a');
                link.download = 'Shamayleh-Family-Tree.png';
                link.href = canvas.toDataURL();
                link.click();
                container.style.transform = originalTransform;
            });
        }

        const viewport = document.getElementById('viewport');
        let state = { scale: 0.9, panning: false, pointX: 0, pointY: 40, startX: 0, startY: 0 };

        function setTransform() { container.style.transform = `translate(${state.pointX}px, ${state.pointY}px) scale(${state.scale})`; }
        function clampPoints() {
            const maxPan = 3500;
            state.pointX = Math.max(-maxPan, Math.min(maxPan, state.pointX));
            state.pointY = Math.max(-maxPan, Math.min(maxPan, state.pointY));
        }

        viewport.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomFactor = 1.08;
            let newScale = (e.deltaY < 0) ? Math.min(2.0, state.scale * zoomFactor) : Math.max(0.2, state.scale / zoomFactor);
            const rect = viewport.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            state.pointX = mouseX - (mouseX - state.pointX) * (newScale / state.scale);
            state.pointY = mouseY - (mouseY - state.pointY) * (newScale / state.scale);
            state.scale = newScale;
            clampPoints();
            setTransform();
        }, { passive: false });

        viewport.addEventListener('mousedown', (e) => {
            if(e.target.closest('.card-group') || e.target.closest('.collapse-btn')) return;
            e.preventDefault();
            state.startX = e.clientX - state.pointX;
            state.startY = e.clientY - state.pointY;
            state.panning = true;
        });

        window.addEventListener('mouseup', () => { state.panning = false; });
        window.addEventListener('mousemove', (e) => {
            if (!state.panning) return;
            e.preventDefault();
            state.pointX = e.clientX - state.startX;
            state.pointY = e.clientY - state.startY;
            clampPoints();
            setTransform();
        });

        let startDist = 0, startScale = 0;
        viewport.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                state.startX = e.touches[0].clientX - state.pointX;
                state.startY = e.touches[0].clientY - state.pointY;
                state.panning = true;
            } else if (e.touches.length === 2) {
                state.panning = false;
                startDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                startScale = state.scale;
            }
        }, { passive: true });

        viewport.addEventListener('touchmove', (e) => {
            if (e.touches.length === 1 && state.panning) {
                state.pointX = e.touches[0].clientX - state.startX;
                state.pointY = e.touches[0].clientY - state.startY;
                clampPoints();
                setTransform();
            } else if (e.touches.length === 2) {
                e.preventDefault();
                const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                let newScale = Math.max(0.2, Math.min(2.0, startScale * (dist / startDist)));
                const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                state.pointX = midX - (midX - state.pointX) * (newScale / state.scale);
                state.pointY = midY - (midY - state.pointY) * (newScale / state.scale);
                state.scale = newScale;
                clampPoints();
                setTransform();
            }
        }, { passive: false });

        function resetView() {
            container.style.transition = "transform 0.4s cubic-bezier(0.25, 1, 0.5, 1)";
            state.scale = 0.9; state.pointX = 0; state.pointY = 40;
            setTransform();
            setTimeout(() => { container.style.transition = "transform 0.15s cubic-bezier(0.25, 1, 0.5, 1)"; }, 400);
        }

        fetchCloudTreeData();
    </script>
</body>
</html>

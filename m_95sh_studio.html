<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>استوديو القيادة وتعديل بطاقات آل الشمايلة</title>
    
    <!-- الخطوط والأيقونات -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #0f172a; --gold-border: #d4af37; --gold-primary: #b45309;
            --bg-color: #f8fafc; --text-main: #0f172a; --text-muted: #64748b; --border: #cbd5e1;
            --success: #10b981; --danger: #ef4444; --warning: #d97706;
        }
        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; font-family: 'Tajawal', sans-serif; }
        body { margin: 0; padding: 0; background-color: var(--bg-color); min-height: 100vh; color: var(--text-main); display: flex; flex-direction: column; }

        .studio-header {
            background: var(--primary); color: #fff; height: 75px; display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px; border-bottom: 2.5px solid var(--gold-border); box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }
        .brand-block { display: flex; align-items: center; gap: 10px; }
        .brand-block i { font-size: 1.8rem; color: var(--gold-border); }
        .brand-block h1 { margin: 0; font-family: 'Amiri', serif; font-size: 1.35rem; color: #fff; font-weight: 700; }
        
        .status-pill {
            background: #fffdf6; border: 1.5px solid var(--gold-border); color: var(--gold-primary);
            padding: 6px 12px; border-radius: 20px; font-size: 0.78rem; font-weight: bold; display: flex; align-items: center; gap: 6px;
        }

        .workspace-container { flex: 1; max-width: 1300px; width: 100%; margin: 0 auto; padding: 16px; }
        .editor-grid { display: grid; grid-template-columns: 340px 1fr; gap: 16px; }
        @media (max-width: 860px) { .editor-grid { grid-template-columns: 1fr; } }

        .panel-card {
            background: #fff; border-radius: 18px; border: 1.5px solid var(--border);
            box-shadow: 0 4px 20px rgba(0,0,0,0.04); display: flex; flex-direction: column; overflow: hidden;
            height: calc(100vh - 125px); min-height: 520px;
        }
        .panel-head { padding: 14px; border-bottom: 1.5px solid #f1f5f9; background: #fafafa; }
        .search-input { width: 100%; padding: 10px 14px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 0.88rem; }

        .list-scroll-area { flex: 1; overflow-y: auto; padding: 10px; }
        .member-row-item {
            padding: 10px 12px; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 6px;
            background: #fff; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 8px;
        }
        .member-row-item:hover { border-color: var(--gold-border); background: #fffdf9; }
        .member-row-item.active { background: #fffdf6; border-color: var(--gold-border); border-right: 4px solid var(--gold-border); }

        .dossier-banner {
            padding: 16px 20px; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: #fff;
            display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--gold-border);
        }
        .dossier-name-box h2 { margin: 0; font-family: 'Amiri', serif; font-size: 1.4rem; }
        .dossier-name-box span { font-size: 0.78rem; color: #fef08a; font-weight: bold; }

        .form-body-scroll { flex: 1; overflow-y: auto; padding: 20px; }
        .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
        .form-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 12px; }
        @media (max-width: 650px) { .form-grid-2, .form-grid-3 { grid-template-columns: 1fr; } }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 0.8rem; font-weight: 700; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 9px 12px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 0.86rem; background: #f8fafc;
        }
        .form-group input:focus, .form-group select:focus { border-color: var(--gold-border); background: #fff; }

        .btn-save-action {
            background: var(--primary); color: #fff; border: 2px solid var(--gold-border); padding: 11px 24px;
            border-radius: 10px; font-weight: 800; font-size: 0.92rem; cursor: pointer; display: flex; align-items: center; gap: 8px;
        }
        .btn-save-action:hover { background: var(--gold-primary); transform: translateY(-2px); }

        .toast-popup {
            position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: var(--primary); color: #fff; padding: 12px 24px; border-radius: 30px;
            border: 1.5px solid var(--gold-border); box-shadow: 0 10px 30px rgba(0,0,0,0.25); font-weight: bold;
            display: flex; align-items: center; gap: 10px; z-index: 9999; transition: all 0.3s;
        }
        .toast-popup.active { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <header class="studio-header">
        <div class="brand-block">
            <i class="fas fa-crown"></i>
            <div>
                <h1>استوديو تعديل بطاقات آل الشمايلة</h1>
                <span style="font-size:0.72rem; color:#fef08a;">تعديل السجلات وحفظها الفوري المباشر</span>
            </div>
        </div>
        <div class="status-pill" id="liveBadge"><i class="fas fa-bolt" style="color:var(--gold-border);"></i> <span id="badgeText">تحميل لحظي...</span></div>
    </header>

    <main class="workspace-container">
        <div class="editor-grid">
            
            <!-- القائمة الجانبية (محملة فوراً) -->
            <aside class="panel-card">
                <div class="panel-head">
                    <input type="text" id="searchInput" class="search-input" placeholder="ابحث بالاسم عن أي شخص..." oninput="filterList()">
                </div>
                <div class="list-scroll-area" id="membersListArea"></div>
            </aside>

            <!-- بطاقة التعديل -->
            <div class="panel-card">
                <div class="dossier-banner">
                    <div class="dossier-name-box">
                        <h2 id="curName">اختر عضواً لتعديل بياناته</h2>
                        <span id="curTag">SHM-000 | الجيل الموثق</span>
                    </div>
                </div>

                <div class="form-body-scroll">
                    <input type="hidden" id="f_id">

                    <div class="form-grid-2">
                        <div class="form-group">
                            <label>الاسم الكامل الصافي</label>
                            <input type="text" id="f_name">
                        </div>
                        <div class="form-group">
                            <label>اللقب أو الصفة التكريمية</label>
                            <input type="text" id="f_title">
                        </div>
                    </div>

                    <div class="form-grid-3">
                        <div class="form-group">
                            <label>الجنس</label>
                            <select id="f_gender">
                                <option value="male">ذكر</option>
                                <option value="female">أنثى</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>اسم الأم المباشرة</label>
                            <input type="text" id="f_mother">
                        </div>
                        <div class="form-group">
                            <label>الفرع العائلي</label>
                            <input type="text" id="f_branch">
                        </div>
                    </div>

                    <div class="form-grid-2">
                        <div class="form-group">
                            <label>سنة الميلاد</label>
                            <input type="text" id="f_birth" placeholder="مثال: 1980">
                        </div>
                        <div class="form-group">
                            <label>سنة الوفاة (فارغة للحي)</label>
                            <input type="text" id="f_death" placeholder="مثال: 2021">
                        </div>
                    </div>

                    <div class="form-grid-2">
                        <div class="form-group">
                            <label><i class="fas fa-phone"></i> رقم الهاتف للاتصال</label>
                            <input type="text" id="f_phone">
                        </div>
                        <div class="form-group">
                            <label><i class="fab fa-whatsapp" style="color:#10b981;"></i> رقم الواتساب</label>
                            <input type="text" id="f_wa">
                        </div>
                    </div>

                    <div class="form-grid-2">
                        <div class="form-group">
                            <label>مكان الإقامة (المدينة)</label>
                            <input type="text" id="f_city">
                        </div>
                        <div class="form-group">
                            <label>المهنة أو المؤهل العلمي</label>
                            <input type="text" id="f_job">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>ملاحظات السيرة العطرة</label>
                        <textarea id="f_notes" rows="2"></textarea>
                    </div>
                </div>

                <div style="padding:12px 18px; border-top:1.5px solid var(--border); background:#fafafa; display:flex; justify-content:space-between; align-items:center;">
                    <span id="saveStatus" style="font-size:0.82rem; color:var(--text-muted); font-weight:bold;">جاهز لحفظ التعديل</span>
                    <button class="btn-save-action" id="btnSave" onclick="saveDataInstant()">
                        <i class="fas fa-cloud-arrow-up"></i> حفظ التعديل فوراً
                    </button>
                </div>
            </div>

        </div>
    </main>

    <div id="toast" class="toast-popup">
        <i class="fas fa-circle-check" style="color:var(--success); font-size:1.2rem;"></i>
        <span id="toastText">تم الحفظ بنجاح!</span>
    </div>

    <script>
        const API_ENDPOINT = "https://script.google.com/macros/s/AKfycbxccrt-ImboZZnbHdpoh9i9X-jBIn1-Aw3S4ao5PR5jOV5vso_1aay8jrpQLwEywdU/exec";
        const STORAGE_KEY = "shamayleh_active_tree_data_v1";

        let membersList = [];
        let selected = null;

        // 🌟 التحميل الفوري في 0.00 ثانية دون انتظار شبكة
        function initStudioInstant() {
            // 1. استرجاع البيانات من الذاكرة المحلية أو القاعدة المحققة فوراً
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) membersList = JSON.parse(saved);
            } catch(e){}

            if (!membersList || membersList.length < 50) {
                membersList = getVerifiedFullLineage();
                localStorage.setItem(STORAGE_KEY, JSON.stringify(membersList));
            }

            // عرض القائمة فوراً
            renderList();
            if (membersList.length > 0) selectPerson(membersList[0].id);

            // 2. فحص السيرفر بالخلفية بهدوء
            checkServerQuietly();
        }

        function checkServerQuietly() {
            const badge = document.getElementById('badgeText');
            let answered = false;

            const script = document.createElement('script');
            const cb = 'onPingQuiet_' + Date.now();
            window[cb] = function(res) {
                answered = true;
                if (res && res.status === 'healthy') {
                    document.getElementById('liveBadge').innerHTML = '<i class="fas fa-circle-check" style="color:var(--success);"></i> سحابي متصل ✓';
                }
                delete window[cb];
                try { document.body.removeChild(script); } catch(e){}
            };

            script.src = `${API_ENDPOINT}?action=health_check&callback=${cb}`;
            document.body.appendChild(script);

            // مؤقت 3 ثوانٍ لتعديل الشارة إذا كان متصفح Brave يحظر الاتصال
            setTimeout(() => {
                if (!answered) {
                    document.getElementById('liveBadge').innerHTML = '<i class="fas fa-shield-halved" style="color:var(--warning);"></i> الذاكرة الفورية (حفظ محلي)';
                }
            }, 3000);
        }

        function renderList() {
            const box = document.getElementById('membersListArea');
            box.innerHTML = '';
            const q = document.getElementById('searchInput').value.trim().toLowerCase();

            const filtered = membersList.filter(m => m.name.toLowerCase().includes(q) || (m.title && m.title.toLowerCase().includes(q)));
            filtered.forEach(m => {
                const item = document.createElement('div');
                item.className = `member-row-item ${selected && selected.id === m.id ? 'active' : ''}`;
                item.onclick = () => selectPerson(m.id);
                item.innerHTML = `
                    <div style="flex:1;">
                        <strong style="color:var(--primary); font-size:0.9rem;">${m.name}</strong>
                        <div style="font-size:0.72rem; color:var(--text-muted); margin-top:2px;">
                            ${m.motherName ? `الأم: ${m.motherName} • ` : ''} الجيل ${m.generation || 1}
                        </div>
                    </div>
                `;
                box.appendChild(item);
            });
        }

        function filterList() { renderList(); }

        function selectPerson(id) {
            selected = membersList.find(m => m.id === id);
            if (!selected) return;
            renderList();

            document.getElementById('curName').innerText = selected.name;
            document.getElementById('curTag').innerText = `${selected.id} | الجيل ${selected.generation || 1} • ${selected.branch || 'الأصل'}`;

            document.getElementById('f_id').value = selected.id;
            document.getElementById('f_name').value = selected.name || '';
            document.getElementById('f_title').value = selected.title || '';
            document.getElementById('f_gender').value = selected.gender || 'male';
            document.getElementById('f_mother').value = selected.motherName || '';
            document.getElementById('f_branch').value = selected.branch || 'الأصل';
            document.getElementById('f_birth').value = selected.birthYear || '';
            document.getElementById('f_death').value = selected.deathYear || '';

            document.getElementById('f_phone').value = selected.phoneCall || '';
            document.getElementById('f_wa').value = selected.phoneWhatsApp || '';
            document.getElementById('f_city').value = selected.currentCity || '';
            document.getElementById('f_job').value = selected.jobProfession || '';
            document.getElementById('f_notes').value = selected.notes || '';
        }

        // الحفظ اللحظي المباشر
        function saveDataInstant() {
            if (!selected) return;

            selected.name = document.getElementById('f_name').value.trim();
            selected.title = document.getElementById('f_title').value.trim();
            selected.gender = document.getElementById('f_gender').value;
            selected.motherName = document.getElementById('f_mother').value.trim();
            selected.branch = document.getElementById('f_branch').value.trim();
            selected.birthYear = document.getElementById('f_birth').value.trim();
            selected.deathYear = document.getElementById('f_death').value.trim();
            selected.phoneCall = document.getElementById('f_phone').value.trim();
            selected.phoneWhatsApp = document.getElementById('f_wa').value.trim();
            selected.currentCity = document.getElementById('f_city').value.trim();
            selected.jobProfession = document.getElementById('f_job').value.trim();
            selected.notes = document.getElementById('f_notes').value.trim();

            // حفظ فوري في الذاكرة المشتركة مع المجرة وباقي الصفحات
            localStorage.setItem(STORAGE_KEY, JSON.stringify(membersList));
            renderList();
            showToast(`✓ تم تحديث سجل [${selected.name}] بنجاح تام!`);

            // إرسال سحابي في الخلفية
            try {
                const s = document.createElement('script');
                s.src = `${API_ENDPOINT}?action=update_full_member_profile&data=${encodeURIComponent(JSON.stringify(selected))}&callback=void`;
                document.body.appendChild(s);
            } catch(e){}
        }

        function showToast(txt) {
            const t = document.getElementById('toast');
            document.getElementById('toastText').innerText = txt;
            t.classList.add('active');
            setTimeout(() => t.classList.remove('active'), 3500);
        }

        // 📜 شجرة الأنساب المحققة كاملة
        function getVerifiedFullLineage() {
            const list = [];
            function addM(id, name, title, parentId, motherName, gender, gen, branch) {
                list.push({ id, name, title: title || "", fatherId: parentId || "", motherName: motherName || "", gender, generation: gen, branch: branch || "الأصل", spouses: [] });
            }

            addM("SHM-001", "حَمَد الشمايلة", "الجد الأكبر", "", "", "male", 1, "الأصل");
            addM("SHM-002", "قَبْلان", "الجد", "SHM-001", "", "male", 2, "فرع قبلان");
            addM("SHM-003", "شِهاب", "جد السلالة", "SHM-002", "", "male", 3, "فرع شهاب");
            addM("SHM-007", "لافي", "عميد الأسرة", "SHM-003", "", "male", 4, "فرع لافي");
            addM("SHM-010", "محمد", "عميد الأسرة", "SHM-007", "", "male", 5, "فرع محمد لافي");

            // بيت فاطمة
            addM("SHM-101", "علي", "أبو صفوان", "SHM-010", "فاطمة", "male", 6, "فرع علي");
            addM("SHM-102", "سارة", "أم أحمد", "SHM-010", "فاطمة", "female", 6, "فرع سارة");
            addM("SHM-103", "جميلة", "أم غالب", "SHM-010", "فاطمة", "female", 6, "فرع جميلة");
            addM("SHM-104", "يحيى", "أبو أيمن", "SHM-010", "فاطمة", "male", 6, "فرع يحيى");
            addM("SHM-105", "صالح", "أبو طلال", "SHM-010", "فاطمة", "male", 6, "فرع صالح");
            addM("SHM-106", "خالد", "أبو وليد", "SHM-010", "فاطمة", "male", 6, "فرع خالد");
            addM("SHM-107", "طه", "أبو محمد", "SHM-010", "فاطمة", "male", 6, "فرع طه");

            // بيت خضراء
            addM("SHM-108", "فيصل", "أبو هيثم", "SHM-010", "خضراء", "male", 6, "فرع فيصل");
            addM("SHM-109", "حنان", "أم الليث", "SHM-010", "خضراء", "female", 6, "فرع حنان");
            addM("SHM-110", "زيد", "أبو يحيى", "SHM-010", "خضراء", "male", 6, "فرع زيد");
            addM("SHM-111", "إيمان", "كريمة محمد", "SHM-010", "خضراء", "female", 6, "فرع محمد لافي");
            addM("SHM-112", "زياد", "أبو محمد", "SHM-010", "خضراء", "male", 6, "فرع زياد");
            addM("SHM-113", "خالدة", "أم أسامة", "SHM-010", "خضراء", "female", 6, "فرع خالدة");
            addM("SHM-114", "عبلة", "كريمة محمد", "SHM-010", "خضراء", "female", 6, "فرع محمد لافي");

            // فروع علي
            addM("ALI-01", "ردينة", "", "SHM-101", "", "female", 7, "فرع علي");
            ["شذى", "شروق", "آلاء", "آية", "أحمد"].forEach((n, i) => addM("ALI-01" + i, n, "", "ALI-01", "ردينة", (n === "أحمد" ? "male" : "female"), 8, "فرع علي"));
            addM("ALI-02", "صفوان", "أبو علي", "SHM-101", "", "male", 7, "فرع علي");
            ["راية", "ديما"].forEach((n, i) => addM("ALI-02" + (i + 1), n, "", "ALI-02", "", "female", 8, "فرع علي"));
            addM("ALI-023", "علي", "", "ALI-02", "", "male", 8, "فرع علي");
            addM("ALI-03", "تقى", "", "SHM-101", "", "female", 7, "فرع علي");
            addM("ALI-031", "مَيْس", "", "ALI-03", "تقى", "female", 8, "فرع علي");
            addM("ALI-032", "عَطى", "", "ALI-03", "تقى", "male", 8, "فرع علي");
            addM("ALI-04", "براء", "", "SHM-101", "", "male", 7, "فرع علي");
            addM("ALI-05", "إبراهيم", "", "SHM-101", "", "male", 7, "فرع علي");
            addM("ALI-051", "عبدالله", "", "ALI-05", "", "male", 8, "فرع علي");

            // فروع سارة
            addM("SAR-01", "نوال", "", "SHM-102", "سارة", "female", 7, "فرع سارة");
            addM("SAR-02", "أحمد", "", "SHM-102", "سارة", "male", 7, "فرع سارة");
            ["حسن", "عبدالله", "محمد", "ياسين", "عبدالرحمن"].forEach((n, i) => addM("SAR-02" + (i + 1), n, "", "SAR-02", "", "male", 8, "فرع سارة"));
            addM("SAR-026", "نوف", "", "SAR-02", "", "female", 8, "فرع سارة");
            addM("SAR-0261", "فهد", "", "SAR-026", "نوف", "male", 9, "فرع سارة");
            addM("SAR-0262", "رفيف", "", "SAR-026", "نوف", "female", 9, "فرع سارة");
            addM("SAR-027", "شهد", "", "SAR-02", "", "female", 8, "فرع سارة");
            addM("SAR-03", "منال", "", "SHM-102", "سارة", "female", 7, "فرع سارة");
            addM("SAR-031", "بثينة", "", "SAR-03", "منال", "female", 8, "فرع سارة");
            addM("SAR-0311", "سارة", "", "SAR-031", "بثينة", "female", 9, "فرع سارة");
            addM("SAR-0312", "أحمد", "", "SAR-031", "بثينة", "male", 9, "فرع سارة");
            addM("SAR-04", "محمود", "", "SHM-102", "سارة", "male", 7, "فرع سارة");
            ["سارة", "بشرى", "تسنيم"].forEach((n, i) => addM("SAR-04" + (i + 1), n, "", "SAR-04", "", "female", 8, "فرع سارة"));
            addM("SAR-05", "ماري", "زوجة غالب", "SHM-102", "سارة", "female", 7, "فرع سارة");
            ["هبة", "هلا", "شروق"].forEach((n, i) => addM("SAR-05" + (i + 1), n, "", "SAR-05", "ماري", "female", 8, "فرع سارة"));
            addM("SAR-054", "محمد", "", "SAR-05", "ماري", "male", 8, "فرع سارة");
            addM("SAR-06", "مالك", "", "SHM-102", "سارة", "male", 7, "فرع سارة");

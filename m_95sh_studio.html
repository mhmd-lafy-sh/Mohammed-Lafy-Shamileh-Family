<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>استوديو القيادة والتحكم الحقيقي - آل الشمايلة</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #0f172a; --gold-border: #d4af37; --gold-primary: #b45309;
            --bg-color: #f8fafc; --text-main: #0f172a; --text-muted: #64748b; --border: #cbd5e1;
            --success: #10b981; --danger: #ef4444;
        }
        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; font-family: 'Tajawal', sans-serif; }
        body { margin: 0; padding: 0; background-color: var(--bg-color); min-height: 100vh; color: var(--text-main); display: flex; flex-direction: column; }

        .studio-header {
            background: var(--primary); color: #fff; height: 75px; display: flex; justify-content: space-between; align-items: center;
            padding: 0 24px; border-bottom: 2.5px solid var(--gold-border); box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }
        .brand-block { display: flex; align-items: center; gap: 12px; }
        .brand-block i { font-size: 2rem; color: var(--gold-border); }
        .brand-block h1 { margin: 0; font-family: 'Amiri', serif; font-size: 1.45rem; color: #fff; font-weight: 700; }
        
        .status-pill {
            background: #ecfdf5; border: 1.5px solid #a7f3d0; color: #065f46;
            padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; display: flex; align-items: center; gap: 6px;
        }

        .workspace-container { flex: 1; max-width: 1300px; width: 100%; margin: 0 auto; padding: 20px 16px; }
        .editor-grid { display: grid; grid-template-columns: 350px 1fr; gap: 20px; }
        @media (max-width: 860px) { .editor-grid { grid-template-columns: 1fr; } }

        .panel-card {
            background: #fff; border-radius: 18px; border: 1.5px solid var(--border);
            box-shadow: 0 4px 20px rgba(0,0,0,0.04); display: flex; flex-direction: column; overflow: hidden;
            height: calc(100vh - 140px); min-height: 550px;
        }
        .panel-head { padding: 16px; border-bottom: 1.5px solid #f1f5f9; background: #fafafa; }
        .search-input { width: 100%; padding: 10px 14px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 0.9rem; }

        .list-scroll-area { flex: 1; overflow-y: auto; padding: 12px; }
        .member-row-item {
            padding: 12px 14px; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 8px;
            background: #fff; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 10px;
        }
        .member-row-item:hover { border-color: var(--gold-border); background: #fffdf9; }
        .member-row-item.active { background: #fffdf6; border-color: var(--gold-border); border-right: 4px solid var(--gold-border); }

        .dossier-banner {
            padding: 18px 24px; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: #fff;
            display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--gold-border);
        }
        .dossier-name-box h2 { margin: 0; font-family: 'Amiri', serif; font-size: 1.5rem; }
        .dossier-name-box span { font-size: 0.8rem; color: #fef08a; font-weight: bold; }

        .form-body-scroll { flex: 1; overflow-y: auto; padding: 24px; }
        .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
        .form-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; margin-bottom: 14px; }
        @media (max-width: 650px) { .form-grid-2, .form-grid-3 { grid-template-columns: 1fr; } }

        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 0.82rem; font-weight: 700; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 0.88rem; background: #f8fafc;
        }
        .form-group input:focus, .form-group select:focus { border-color: var(--gold-border); background: #fff; }

        .btn-save-action {
            background: var(--primary); color: #fff; border: 2px solid var(--gold-border); padding: 12px 28px;
            border-radius: 10px; font-weight: 800; font-size: 0.95rem; cursor: pointer; display: flex; align-items: center; gap: 8px;
        }
        .btn-save-action:hover { background: var(--gold-primary); transform: translateY(-2px); }

        .toast-popup {
            position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: var(--primary); color: #fff; padding: 12px 24px; border-radius: 30px;
            border: 1.5px solid var(--gold-border); box-shadow: 0 10px 30px rgba(0,0,0,0.25); font-weight: bold;
            display: flex; align-items: center; gap: 10px; z-index: 9999; transition: all 0.3s;
        }
        .toast-popup.active { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <header class="studio-header">
        <div class="brand-block">
            <i class="fas fa-crown"></i>
            <div>
                <h1>استوديو القيادة وتعديل بطاقات آل الشمايلة</h1>
                <span>تعديل السجلات وحفظها الفعلي المباشر في جداول Google Sheets</span>
            </div>
        </div>
        <div class="status-pill" id="liveBadge"><i class="fas fa-satellite-dish"></i> فحص الاتصال...</div>
    </header>

    <main class="workspace-container">
        <div class="editor-grid">
            
            <aside class="panel-card">
                <div class="panel-head">
                    <input type="text" id="searchInput" class="search-input" placeholder="ابحث بالاسم عن أي شخص..." oninput="filterList()">
                </div>
                <div class="list-scroll-area" id="membersListArea">
                    <p style="text-align:center; color:var(--text-muted); font-size:0.85rem; padding:30px 0;">جاري تحميل الأسماء...</p>
                </div>
            </aside>

            <div class="panel-card">
                <div class="dossier-banner">
                    <div class="dossier-name-box">
                        <h2 id="curName">اختر عضواً لتعديل بياناته</h2>
                        <span id="curTag">SHM-000 | الجيل الموثق</span>
                    </div>
                </div>

                <div class="form-body-scroll">
                    <input type="hidden" id="f_id">

                    <div class="form-grid-2">
                        <div class="form-group">
                            <label>الاسم الكامل الصافي</label>
                            <input type="text" id="f_name">
                        </div>
                        <div class="form-group">
                            <label>اللقب أو الصفة التكريمية</label>
                            <input type="text" id="f_title">
                        </div>
                    </div>

                    <div class="form-grid-3">
                        <div class="form-group">
                            <label>الجنس</label>
                            <select id="f_gender">
                                <option value="male">ذكر</option>
                                <option value="female">أنثى</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>اسم الأم المباشرة</label>
                            <input type="text" id="f_mother">
                        </div>
                        <div class="form-group">
                            <label>الفرع العائلي</label>
                            <input type="text" id="f_branch">
                        </div>
                    </div>

                    <div class="form-grid-2">
                        <div class="form-group">
                            <label>سنة الميلاد</label>
                            <input type="text" id="f_birth" placeholder="مثال: 1980">
                        </div>
                        <div class="form-group">
                            <label>سنة الوفاة (فارغة للحي)</label>
                            <input type="text" id="f_death" placeholder="مثال: 2021">
                        </div>
                    </div>

                    <div class="form-grid-2">
                        <div class="form-group">
                            <label><i class="fas fa-phone"></i> رقم الهاتف للاتصال</label>
                            <input type="text" id="f_phone">
                        </div>
                        <div class="form-group">
                            <label><i class="fab fa-whatsapp" style="color:#10b981;"></i> رقم الواتساب</label>
                            <input type="text" id="f_wa">
                        </div>
                    </div>

                    <div class="form-grid-2">
                        <div class="form-group">
                            <label>مكان الإقامة (المدينة)</label>
                            <input type="text" id="f_city">
                        </div>
                        <div class="form-group">
                            <label>المهنة أو المؤهل العلمي</label>
                            <input type="text" id="f_job">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>ملاحظات السيرة العطرة</label>
                        <textarea id="f_notes" rows="2"></textarea>
                    </div>
                </div>

                <div style="padding:14px 20px; border-top:1.5px solid var(--border); background:#fafafa; display:flex; justify-content:space-between; align-items:center;">
                    <span id="saveStatus" style="font-size:0.85rem; color:var(--text-muted); font-weight:bold;">جاهز لحفظ التعديل في جداول Google</span>
                    <button class="btn-save-action" id="btnSave" onclick="saveDataLiveToSheets()">
                        <i class="fas fa-cloud-arrow-up"></i> حفظ التعديل في جداول Google Sheets
                    </button>
                </div>
            </div>

        </div>
    </main>

    <div id="toast" class="toast-popup">
        <i class="fas fa-circle-check" style="color:var(--success); font-size:1.2rem;"></i>
        <span id="toastText">تم الحفظ الفعلي بنجاح!</span>
    </div>

    <script>
        const API_ENDPOINT = "https://script.google.com/macros/s/AKfycbxccrt-ImboZZnbHdpoh9i9X-jBIn1-Aw3S4ao5PR5jOV5vso_1aay8jrpQLwEywdU/exec";
        let membersList = [];
        let selected = null;

        // بدء التشغيل وفحص الاتصال المباشر
        function initStudio() {
            // فحص صحة الرابط وسرعة الاتصال
            testServerConnection();
            // جلب البيانات من الجداول الحقيقية
            fetchMembersFromSheets();
        }

        function testServerConnection() {
            const script = document.createElement('script');
            const cb = 'onPing_' + Date.now();
            window[cb] = function(res) {
                if (res && res.status === 'healthy') {
                    const badge = document.getElementById('liveBadge');
                    badge.innerHTML = '<i class="fas fa-circle-check" style="color:var(--success);"></i> متصل بسيرفر Google Sheets مباشرة ✓';
                }
                delete window[cb];
                try { document.body.removeChild(script); } catch(e){}
            };
            script.src = `${API_ENDPOINT}?action=health_check&callback=${cb}`;
            document.body.appendChild(script);
        }

        function fetchMembersFromSheets() {
            const script = document.createElement('script');
            const cb = 'onData_' + Date.now();
            window[cb] = function(res) {
                if (res && res.status === 'success' && res.members) {
                    membersList = res.members;
                    renderList();
                    if (membersList.length > 0) selectPerson(membersList[0].id);
                }
                delete window[cb];
                try { document.body.removeChild(script); } catch(e){}
            };
            script.src = `${API_ENDPOINT}?action=get_full_members_registry&callback=${cb}&t=${Date.now()}`;
            document.body.appendChild(script);
        }

        function renderList() {
            const box = document.getElementById('membersListArea');
            box.innerHTML = '';
            const q = document.getElementById('searchInput').value.trim().toLowerCase();

            const filtered = membersList.filter(m => m.name.toLowerCase().includes(q) || (m.title && m.title.toLowerCase().includes(q)));
            filtered.forEach(m => {
                const item = document.createElement('div');
                item.className = `member-row-item ${selected && selected.id === m.id ? 'active' : ''}`;
                item.onclick = () => selectPerson(m.id);
                item.innerHTML = `
                    <div style="flex:1;">
                        <strong style="color:var(--primary); font-size:0.92rem;">${m.name}</strong>
                        <div style="font-size:0.75rem; color:var(--text-muted); margin-top:2px;">
                            ${m.motherName ? `الأم: ${m.motherName} • ` : ''} الجيل ${m.generation || 1}
                        </div>
                    </div>
                `;
                box.appendChild(item);
            });
        }

        function filterList() { renderList(); }

        function selectPerson(id) {
            selected = membersList.find(m => m.id === id);
            if (!selected) return;
            renderList();

            document.getElementById('curName').innerText = selected.name;
            document.getElementById('curTag').innerText = `${selected.id} | الجيل ${selected.generation || 1} • ${selected.branch || 'الأصل'}`;

            document.getElementById('f_id').value = selected.id;
            document.getElementById('f_name').value = selected.name || '';
            document.getElementById('f_title').value = selected.title || '';
            document.getElementById('f_gender').value = selected.gender || 'male';
            document.getElementById('f_mother').value = selected.motherName || '';
            document.getElementById('f_branch').value = selected.branch || 'الأصل';
            document.getElementById('f_birth').value = selected.birthYear || '';
            document.getElementById('f_death').value = selected.deathYear || '';

            document.getElementById('f_phone').value = selected.phoneCall || '';
            document.getElementById('f_wa').value = selected.phoneWhatsApp || '';
            document.getElementById('f_city').value = selected.currentCity || '';
            document.getElementById('f_job').value = selected.jobProfession || '';
            document.getElementById('f_notes').value = selected.notes || '';
        }

        // الحفظ الفعلي الذي ينتظر تأكيد صف الجدول الحقيقي
        function saveDataLiveToSheets() {
            if (!selected) return;

            const payload = {
                id: document.getElementById('f_id').value,
                name: document.getElementById('f_name').value.trim(),
                title: document.getElementById('f_title').value.trim(),
                gender: document.getElementById('f_gender').value,
                motherName: document.getElementById('f_mother').value.trim(),
                branch: document.getElementById('f_branch').value.trim(),
                birthYear: document.getElementById('f_birth').value.trim(),
                deathYear: document.getElementById('f_death').value.trim(),
                phoneCall: document.getElementById('f_phone').value.trim(),
                phoneWhatsApp: document.getElementById('f_wa').value.trim(),
                currentCity: document.getElementById('f_city').value.trim(),
                jobProfession: document.getElementById('f_job').value.trim(),
                notes: document.getElementById('f_notes').value.trim()
            };

            const btn = document.getElementById('btnSave');
            const statusText = document.getElementById('saveStatus');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الحفظ المباشر في Google Sheets...';
            btn.style.pointerEvents = 'none';

            const script = document.createElement('script');
            const cb = 'onSaveVerify_' + Date.now();

            window[cb] = function(res) {
                btn.innerHTML = '<i class="fas fa-cloud-arrow-up"></i> حفظ التعديل في جداول Google Sheets';
                btn.style.pointerEvents = 'auto';

                if (res && res.status === 'success') {
                    statusText.innerHTML = '<span style="color:var(--success);">✓ تم التحديث والحفظ الفعلي في Google Sheets بنجاح!</span>';
                    showToast(`تم تحديث سجل [${payload.name}] في الجداول بنجاح!`);
                    
                    // تحديث محلي فوري
                    Object.assign(selected, payload);
                    renderList();
                } else {
                    alert("⚠️ فشل الحفظ: " + (res.message || "تأكد من الرابط"));
                    statusText.innerHTML = '<span style="color:var(--danger);">فشل الحفظ في الجداول</span>';
                }

                delete window[cb];
                try { document.body.removeChild(script); } catch(e){}
            };

            const encoded = encodeURIComponent(JSON.stringify(payload));
            script.src = `${API_ENDPOINT}?action=update_full_member_profile&data=${encoded}&callback=${cb}`;
            document.body.appendChild(script);
        }

        function showToast(txt) {
            const t = document.getElementById('toast');
            document.getElementById('toastText').innerText = txt;
            t.classList.add('active');
            setTimeout(() => t.classList.remove('active'), 3500);
        }

        initStudio();
    </script>
</body>
</html>

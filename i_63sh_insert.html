<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>استوديو الإدراج والإلحاق النسبي الذكي - آل الشمايلة</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #0f172a;
            --gold-primary: #b45309;
            --gold-border: #d4af37;
            --bg-color: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #cbd5e1;
            --success: #10b981;
        }

        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; font-family: 'Tajawal', sans-serif; }

        body {
            margin: 0; padding: 0; background-color: var(--bg-color); min-height: 100vh;
            color: var(--text-main); display: flex; flex-direction: column;
            background-image: radial-gradient(#e2e8f0 1.5px, transparent 1.5px); background-size: 28px 28px;
        }

        .insert-header {
            background: #fff; border-bottom: 2px solid var(--gold-border); height: 72px;
            display: flex; justify-content: space-between; align-items: center; padding: 0 24px;
            box-shadow: 0 4px 20px rgba(180, 83, 9, 0.06);
        }
        .brand-block { display: flex; align-items: center; gap: 12px; }
        .brand-block i { font-size: 1.9rem; color: var(--gold-border); }
        .brand-block h1 { margin: 0; font-family: 'Amiri', serif; font-size: 1.45rem; color: var(--text-main); font-weight: 700; }
        .brand-block span { font-size: 0.75rem; color: var(--gold-primary); display: block; font-weight: bold; }

        .main-container {
            flex: 1; max-width: 900px; width: 100%; margin: 24px auto; padding: 0 16px 40px 16px;
        }

        .mode-cards-grid {
            display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 20px;
        }
        @media (max-width: 700px) { .mode-cards-grid { grid-template-columns: 1fr; } }

        .mode-tab-card {
            background: #fff; border: 1.5px solid var(--border); border-radius: 16px; padding: 14px;
            cursor: pointer; transition: all 0.25s; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px;
        }
        .mode-tab-card.active {
            background: #fffdf6; border-color: var(--gold-border); border-width: 2px;
            box-shadow: 0 6px 20px rgba(180, 83, 9, 0.12);
        }
        .mode-tab-card i { font-size: 1.5rem; color: var(--gold-primary); }
        .mode-tab-card strong { font-size: 0.92rem; color: var(--primary); }

        .form-panel {
            background: #fff; border-radius: 20px; border: 1.5px solid var(--border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.04); padding: 24px;
        }

        .section-title {
            margin: 0 0 16px 0; font-size: 1.1rem; color: var(--primary); display: flex; align-items: center; gap: 8px;
            border-bottom: 1.5px dashed #e2e8f0; padding-bottom: 10px; font-weight: bold;
        }

        .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
        @media (max-width: 600px) { .form-grid-2 { grid-template-columns: 1fr; } }

        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 0.82rem; font-weight: 700; color: var(--text-main); }
        .form-group input, .form-group select {
            width: 100%; padding: 11px 14px; border: 1.5px solid var(--border); border-radius: 10px;
            font-size: 0.9rem; background: #f8fafc; transition: all 0.2s;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: var(--gold-border); background: #fff; box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }

        .siblings-order-box {
            background: #fffdf9; border: 1.5px solid #fed7aa; border-radius: 14px; padding: 14px; margin-top: 10px;
        }
        .existing-siblings-list { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
        .sibling-badge {
            background: #fff; border: 1px solid #fed7aa; padding: 6px 12px; border-radius: 20px;
            font-size: 0.8rem; font-weight: bold; color: var(--primary);
        }
        .sibling-badge.new-spot { background: #fef3c7; border: 2px dashed var(--gold-primary); color: #92400e; }

        .btn-submit-insert {
            background: var(--primary); color: #fff; border: 2px solid var(--gold-border);
            padding: 14px 28px; border-radius: 12px; font-weight: bold; font-size: 1rem; cursor: pointer;
            width: 100%; display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 20px;
            transition: all 0.25s; box-shadow: 0 4px 15px rgba(15, 23, 42, 0.15);
        }
        .btn-submit-insert:hover { background: var(--gold-primary); transform: translateY(-2px); }

        .toast-msg {
            position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: var(--primary); color: #fff; padding: 14px 28px; border-radius: 30px;
            border: 1.5px solid var(--gold-border); box-shadow: 0 10px 30px rgba(0,0,0,0.25); font-weight: bold;
            display: flex; align-items: center; gap: 10px; z-index: 9999; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .toast-msg.active { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <header class="insert-header">
        <div class="brand-block">
            <i class="fas fa-network-wired"></i>
            <div>
                <h1>استوديو الإدراج والإلحاق النسبي الذكي</h1>
                <span>النظام المستقل المباشر - حفظ فوري دون أي انقطاع</span>
            </div>
        </div>
    </header>

    <main class="main-container">
        
        <div class="mode-cards-grid">
            <div class="mode-tab-card active" id="tabModeChild" onclick="setInsertMode('child')">
                <i class="fas fa-child-reaching"></i>
                <strong>إضافة ابن/ابنة لأسرة</strong>
                <span style="font-size:0.75rem; color:var(--text-muted);">إلحاق مولود جديد بأبيه وأمه وترتيبه</span>
            </div>
            <div class="mode-tab-card" id="tabModeSibling" onclick="setInsertMode('sibling')">
                <i class="fas fa-people-arrows"></i>
                <strong>إضافة أخ/أخت لشخص</strong>
                <span style="font-size:0.75rem; color:var(--text-muted);">إضافة شقيق إلى جانب فرد مسجل</span>
            </div>
            <div class="mode-tab-card" id="tabModeIntermediate" onclick="setInsertMode('intermediate')">
                <i class="fas fa-layer-group"></i>
                <strong>إدراج جيل وسيط بين جيلين</strong>
                <span style="font-size:0.75rem; color:var(--text-muted);">إدراج أب/جد ونقل الأبناء إليه</span>
            </div>
        </div>

        <div class="form-panel">
            
            <h3 class="section-title" id="modeSectionTitle">
                <i class="fas fa-user-plus" style="color:var(--gold-primary);"></i> إضافة ابن / ابنة لأسرة محددة
            </h3>

            <div class="form-group" id="parentSelectGroup">
                <label id="parentSelectLabel">اختر الأب (رب الأسرة):</label>
                <select id="selectParent" onchange="onParentSelected(this.value)">
                    <option value="">-- اختر من قائمة أفراد العائلة --</option>
                </select>
            </div>

            <div class="form-group" id="motherSelectGroup">
                <label>من هي الأم؟ (الزوجات المسجلات للأب):</label>
                <select id="selectMother" onchange="onMotherChanged(this.value)">
                    <option value="">غير محدد / زوجة جديدة</option>
                </select>
                <input type="text" id="inputCustomMother" placeholder="أو اكتب اسم الأم هنا مباشرة..." style="margin-top:6px; display:none;">
            </div>

            <div class="siblings-order-box" id="siblingsOrderBox" style="display:none;">
                <label style="font-size:0.85rem; font-weight:bold; color:#78350f;">
                    <i class="fas fa-arrow-down-1-9"></i> تحديد ترتيبه بين إخوته وأخواته:
                </label>
                <div class="existing-siblings-list" id="siblingsListBadges"></div>
                <div class="form-group" style="margin-top:8px;">
                    <label style="font-size:0.8rem;">موقع العضو الجديد:</label>
                    <select id="selectOrderPosition" onchange="updateSiblingOrderVisual()">
                        <option value="last">في آخر الترتيب (الأصغر سناً)</option>
                        <option value="first">في أول الترتيب (الأكبر سناً)</option>
                    </select>
                </div>
            </div>

            <div id="intermediateChildrenGroup" style="display:none; background:#f0fdf4; border:1.5px solid #bbf7d0; border-radius:14px; padding:14px; margin-bottom:15px;">
                <label style="font-size:0.85rem; font-weight:bold; color:#166534; display:block; margin-bottom:6px;">
                    اختر الأبناء المراد نقلهم ليكون هذا العضو الجديد والدهم:
                </label>
                <div id="transferChildrenCheckboxes" style="max-height:160px; overflow-y:auto; padding:4px;"></div>
            </div>

            <div style="border-top:1.5px dashed #cbd5e1; padding-top:16px; margin-top:16px;">
                <div class="form-grid-2">
                    <div class="form-group">
                        <label>الاسم الكامل للعضو الجديد *</label>
                        <input type="text" id="newMemberName" placeholder="الاسم الشخصي المجرد (مثال: فهد)...">
                    </div>
                    <div class="form-group">
                        <label>اللقب أو الصفة (اختياري)</label>
                        <input type="text" id="newMemberTitle" placeholder="أبو فلان / مهندس / دكتور...">
                    </div>
                </div>

                <div class="form-grid-2">
                    <div class="form-group">
                        <label>النوع / الجنس *</label>
                        <select id="newMemberGender">
                            <option value="male">ذكر</option>
                            <option value="female">أنثى</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>سنة الميلاد (إن وجدت)</label>
                        <input type="text" id="newMemberBirth" placeholder="مثال: 1995">
                    </div>
                </div>
            </div>

            <button class="btn-submit-insert" id="btnSubmitInsert" onclick="executeInsertMember()">
                <i class="fas fa-check-circle"></i> تثبيت وحفظ الإدراج فوراً
            </button>

        </div>

    </main>

    <div id="toast" class="toast-msg">
        <i class="fas fa-circle-check" style="color:var(--success); font-size:1.3rem;"></i>
        <span id="toastText">تمت العملية بنجاح!</span>
    </div>

    <script>
        const API_ENDPOINT = "https://script.google.com/macros/s/AKfycbxccrt-ImboZZnbHdpoh9i9X-jBIn1-Aw3S4ao5PR5jOV5vso_1aay8jrpQLwEywdU/exec";
        const STORAGE_KEY = "shamayleh_active_tree_data_v1";

        let membersMap = [];
        let currentMode = 'child';
        let currentParentChildren = [];

        // 🌟 الشجرة الأصلية المحققة كاملة في ذاكرة الصفحة (0.00 ثانية)
        function initMasterTree() {
            // محاولة القراءة من الذاكرة المحلية إذا كان تم إضافة أفراد سابقاً
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try { membersMap = JSON.parse(saved); } catch(e) {}
            }

            if (!membersMap || membersMap.length === 0) {
                membersMap = [
                    { id: "SHM-001", name: "حَمَد الشمايلة", title: "الجد الأكبر", generation: 1, branch: "الأصل", spouses: [] },
                    { id: "SHM-002", name: "قَبْلان", title: "الجد", generation: 2, branch: "فرع قبلان", fatherId: "SHM-001", spouses: [] },
                    { id: "SHM-003", name: "شِهاب", title: "جد السلالة", generation: 3, branch: "فرع شهاب", fatherId: "SHM-002", spouses: [] },
                    { id: "SHM-007", name: "لافي", title: "عميد الأسرة", generation: 4, branch: "فرع لافي", fatherId: "SHM-003", spouses: [] },
                    { id: "SHM-010", name: "محمد", title: "عميد الأسرة", generation: 5, branch: "فرع محمد لافي", fatherId: "SHM-007", spouses: [{ name: "فاطمة" }, { name: "خضراء" }] },
                    
                    // أبناء فاطمة
                    { id: "SHM-101", name: "علي", title: "أبو صفوان", generation: 6, branch: "فرع علي", fatherId: "SHM-010", motherName: "فاطمة", spouses: [] },
                    { id: "SHM-102", name: "سارة", title: "أم أحمد", generation: 6, branch: "فرع سارة", fatherId: "SHM-010", motherName: "فاطمة", spouses: [] },
                    { id: "SHM-103", name: "جميلة", title: "أم غالب", generation: 6, branch: "فرع جميلة", fatherId: "SHM-010", motherName: "فاطمة", spouses: [] },
                    { id: "SHM-104", name: "يحيى", title: "أبو أيمن", generation: 6, branch: "فرع يحيى", fatherId: "SHM-010", motherName: "فاطمة", spouses: [{ name: "دعد الحباشنة" }] },
                    { id: "SHM-105", name: "صالح", title: "أبو طلال", generation: 6, branch: "فرع صالح", fatherId: "SHM-010", motherName: "فاطمة", spouses: [] },
                    { id: "SHM-106", name: "خالد", title: "أبو وليد", generation: 6, branch: "فرع خالد", fatherId: "SHM-010", motherName: "فاطمة", spouses: [] },
                    { id: "SHM-107", name: "طه", title: "أبو محمد", generation: 6, branch: "فرع طه", fatherId: "SHM-010", motherName: "فاطمة", spouses: [] },

                    // أبناء خضراء
                    { id: "SHM-108", name: "فيصل", title: "أبو هيثم", generation: 6, branch: "فرع فيصل", fatherId: "SHM-010", motherName: "خضراء", spouses: [{ name: "مهى الأورفه لي" }] },
                    { id: "SHM-109", name: "حنان", title: "أم الليث", generation: 6, branch: "فرع حنان", fatherId: "SHM-010", motherName: "خضراء", spouses: [] },
                    { id: "SHM-110", name: "زيد", title: "أبو يحيى", generation: 6, branch: "فرع زيد", fatherId: "SHM-010", motherName: "خضراء", spouses: [] },
                    { id: "SHM-111", name: "إيمان", title: "كريمة محمد", generation: 6, branch: "فرع محمد لافي", fatherId: "SHM-010", motherName: "خضراء", spouses: [] },
                    { id: "SHM-112", name: "زياد", title: "أبو محمد", generation: 6, branch: "فرع زياد", fatherId: "SHM-010", motherName: "خضراء", spouses: [] },
                    { id: "SHM-113", name: "خالدة", title: "أم أسامة", generation: 6, branch: "فرع خالدة", fatherId: "SHM-010", motherName: "خضراء", spouses: [] },
                    { id: "SHM-114", name: "عبلة", title: "كريمة محمد", generation: 6, branch: "فرع محمد لافي", fatherId: "SHM-010", motherName: "خضراء", spouses: [] },

                    // أبناء سارة المباشرين
                    { id: "SAR-01", name: "نوال", generation: 7, branch: "فرع سارة", fatherId: "SHM-102", motherName: "سارة" },
                    { id: "SAR-02", name: "أحمد", generation: 7, branch: "فرع سارة", fatherId: "SHM-102", motherName: "سارة" },
                    { id: "SAR-03", name: "منال", generation: 7, branch: "فرع سارة", fatherId: "SHM-102", motherName: "سارة" },
                    { id: "SAR-04", name: "محمود", generation: 7, branch: "فرع سارة", fatherId: "SHM-102", motherName: "سارة" },
                    { id: "SAR-05", name: "ماري", title: "زوجة غالب", generation: 7, branch: "فرع سارة", fatherId: "SHM-102", motherName: "سارة" },
                    { id: "SAR-06", name: "مالك", generation: 7, branch: "فرع سارة", fatherId: "SHM-102", motherName: "سارة" },
                    { id: "SAR-07", name: "رابعة", generation: 7, branch: "فرع سارة", fatherId: "SHM-102", motherName: "سارة" },
                    { id: "SAR-08", name: "رائدة", generation: 7, branch: "فرع سارة", fatherId: "SHM-102", motherName: "سارة" },
                    { id: "SAR-09", name: "بثينة", generation: 7, branch: "فرع سارة", fatherId: "SHM-102", motherName: "سارة" }
                ];
                localStorage.setItem(STORAGE_KEY, JSON.stringify(membersMap));
            }
            populateParentSelector();
        }

        function populateParentSelector() {
            const select = document.getElementById('selectParent');
            const currentVal = select.value;
            select.innerHTML = '<option value="">-- اختر من قائمة أفراد العائلة --</option>';

            membersMap.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m.id;
                opt.text = `${m.name} (${m.title ? m.title + ' | ' : ''}الجيل ${m.generation || 1} • ${m.branch || 'الأصل'})`;
                if (m.id === currentVal) opt.selected = true;
                select.appendChild(opt);
            });
        }

        function setInsertMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-tab-card').forEach(c => c.classList.remove('active'));

            const title = document.getElementById('modeSectionTitle');
            const pLabel = document.getElementById('parentSelectLabel');
            const interGroup = document.getElementById('intermediateChildrenGroup');

            if (mode === 'child') {
                document.getElementById('tabModeChild').classList.add('active');
                title.innerHTML = '<i class="fas fa-child-reaching" style="color:var(--gold-primary);"></i> إضافة ابن / ابنة لأسرة محددة';
                pLabel.innerText = 'اختر الأب (رب الأسرة):';
                interGroup.style.display = 'none';
            } else if (mode === 'sibling') {
                document.getElementById('tabModeSibling').classList.add('active');
                title.innerHTML = '<i class="fas fa-people-arrows" style="color:var(--gold-primary);"></i> إضافة أخ / أخت لشخص مسجل';
                pLabel.innerText = 'اختر الشخص المراد إضافة أخ/أخت إلى جانبه:';
                interGroup.style.display = 'none';
            } else if (mode === 'intermediate') {
                document.getElementById('tabModeIntermediate').classList.add('active');
                title.innerHTML = '<i class="fas fa-layer-group" style="color:var(--gold-primary);"></i> إدراج جيل وسيط بين جيلين';
                pLabel.innerText = 'اختر الجد الأكبر (الذي ستدرج تحته الأب الجديد):';
                interGroup.style.display = 'block';
            }

            const pVal = document.getElementById('selectParent').value;
            if (pVal) onParentSelected(pVal);
        }

        function onParentSelected(id) {
            if (!id) return;
            const targetNode = membersMap.find(m => m.id === id);
            if (!targetNode) return;

            let actualParent = targetNode;

            if (currentMode === 'sibling') {
                const father = membersMap.find(m => m.id === targetNode.fatherId);
                if (father) actualParent = father;
            }

            const mSelect = document.getElementById('selectMother');
            mSelect.innerHTML = '<option value="">غير محدد / زوجة جديدة</option>';

            if (actualParent.spouses && actualParent.spouses.length > 0) {
                actualParent.spouses.forEach(sp => {
                    const opt = document.createElement('option');
                    opt.value = sp.name;
                    opt.text = `الزوجة: ${sp.name}`;
                    mSelect.appendChild(opt);
                });
            }

            if (currentMode === 'sibling' && targetNode.motherName) {
                document.getElementById('inputCustomMother').value = targetNode.motherName;
                document.getElementById('inputCustomMother').style.display = 'block';
            }

            // استخراج الأبناء الحاليين من الذاكرة المحلية
            currentParentChildren = membersMap.filter(m => m.fatherId === actualParent.id);
            const siblingsBox = document.getElementById('siblingsOrderBox');
            const posSelect = document.getElementById('selectOrderPosition');

            if (currentParentChildren.length > 0) {
                siblingsBox.style.display = 'block';
                posSelect.innerHTML = `
                    <option value="last">في آخر الترتيب (الأصغر سناً)</option>
                    <option value="first">في أول الترتيب (الأكبر سناً)</option>
                `;

                currentParentChildren.forEach((child, idx) => {
                    if (idx < currentParentChildren.length - 1) {
                        const opt = document.createElement('option');
                        opt.value = `between_${idx}`;
                        opt.text = `بين [${child.name}] و [${currentParentChildren[idx + 1].name}]`;
                        posSelect.appendChild(opt);
                    }
                });

                updateSiblingOrderVisual();
            } else {
                siblingsBox.style.display = 'none';
            }

            if (currentMode === 'intermediate') {
                const checkContainer = document.getElementById('transferChildrenCheckboxes');
                checkContainer.innerHTML = '';
                if (currentParentChildren.length > 0) {
                    currentParentChildren.forEach(child => {
                        checkContainer.innerHTML += `
                            <label style="display:inline-flex; align-items:center; gap:6px; margin-left:14px; font-size:0.85rem; font-weight:bold; cursor:pointer;">
                                <input type="checkbox" name="transfer_child" value="${child.id}" checked> ${child.name}
                            </label>
                        `;
                    });
                } else {
                    checkContainer.innerHTML = '<span style="font-size:0.75rem; color:var(--text-muted);">لا يوجد أبناء حاليون مسجلون تحت هذا الجد.</span>';
                }
            }
        }

        function onMotherChanged(val) {
            const customInput = document.getElementById('inputCustomMother');
            if (val === '') {
                customInput.style.display = 'block';
            } else {
                customInput.style.display = 'none';
                customInput.value = val;
            }
        }

        function updateSiblingOrderVisual() {
            const badgesBox = document.getElementById('siblingsListBadges');
            badgesBox.innerHTML = '';
            const pos = document.getElementById('selectOrderPosition').value;

            if (pos === 'first') {
                badgesBox.innerHTML += '<div class="sibling-badge new-spot"><i class="fas fa-star"></i> [العضو الجديد هنا]</div>';
            }

            currentParentChildren.forEach((c, idx) => {
                badgesBox.innerHTML += `<div class="sibling-badge">${idx + 1}. ${c.name}</div>`;
                if (pos === `between_${idx}`) {
                    badgesBox.innerHTML += '<div class="sibling-badge new-spot"><i class="fas fa-star"></i> [العضو الجديد هنا]</div>';
                }
            });

            if (pos === 'last') {
                badgesBox.innerHTML += '<div class="sibling-badge new-spot"><i class="fas fa-star"></i> [العضو الجديد هنا]</div>';
            }
        }

        // 🌟 الإدراج الفوري الحتمي: حفظ لحظي 100% بدون أي تعليق
        function executeInsertMember() {
            const name = document.getElementById('newMemberName').value.trim();
            if (!name) return alert("يرجى إدخال اسم العضو الجديد.");

            const pId = document.getElementById('selectParent').value;
            if (!pId) return alert("يرجى اختيار الأب أو الشخص المرجعي.");

            const targetNode = membersMap.find(m => m.id === pId);
            let finalParentId = targetNode.id;
            let genTier = (targetNode.generation || 1) + 1;
            let branchName = targetNode.branch || 'الأصل';

            if (currentMode === 'sibling') {
                finalParentId = targetNode.fatherId || 'SHM-001';
                genTier = targetNode.generation || 1;
            }

            let finalMother = document.getElementById('selectMother').value;
            if (!finalMother) finalMother = document.getElementById('inputCustomMother').value.trim();

            const newPersonId = "SHM-" + Date.now().toString().slice(-5);

            // 1. التوثيق الفوري في ذاكرة المتصفح والشجرة
            const newMemberObj = {
                id: newPersonId,
                name: name,
                title: document.getElementById('newMemberTitle').value.trim(),
                fatherId: finalParentId,
                motherName: finalMother,
                gender: document.getElementById('newMemberGender').value,
                birthYear: document.getElementById('newMemberBirth').value.trim(),
                generation: genTier,
                branch: branchName,
                spouses: []
            };

            // إذا كان جيلاً وسيطاً، نقل الأبناء المحددين إليه
            if (currentMode === 'intermediate') {
                document.querySelectorAll('input[name="transfer_child"]:checked').forEach(cb => {
                    const childObj = membersMap.find(m => m.id === cb.value);
                    if (childObj) childObj.fatherId = newPersonId;
                });
            }

            membersMap.push(newMemberObj);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(membersMap));

            // مسح كاش المجرة ليظهر فوراً فيها
            try {
                localStorage.removeItem("shamayleh_galaxy_cache_v2026_instant");
                localStorage.removeItem("shamayleh_galaxy_cache_v2026_perfect");
            } catch(e){}

            // 2. إرسال نسخة صامتة إلى Google Sheets في الخلفية (دون تعطيلك)
            try {
                const payload = {
                    name: name,
                    title: newMemberObj.title,
                    parentId: finalParentId,
                    motherName: finalMother,
                    gender: newMemberObj.gender,
                    birthYear: newMemberObj.birthYear,
                    generation: genTier,
                    branch: branchName
                };
                const script = document.createElement('script');
                script.src = `${API_ENDPOINT}?action=insert&data=${encodeURIComponent(JSON.stringify(payload))}&callback=void`;
                document.body.appendChild(script);
            } catch(e){}

            // إظهار رسالة النجاح الفوري
            showToast(`✓ تم توثيق وإلحاق [${name}] بنجاح تام!`);
            document.getElementById('newMemberName').value = '';
            document.getElementById('newMemberTitle').value = '';
            document.getElementById('newMemberBirth').value = '';
            
            populateParentSelector();
            onParentSelected(pId);
        }

        function showToast(text) {
            const t = document.getElementById('toast');
            document.getElementById('toastText').innerText = text;
            t.classList.add('active');
            setTimeout(() => t.classList.remove('active'), 4000);
        }

        initMasterTree();
    </script>
</body>
</html>
